<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AgentPro · 智能体空间</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%),
                        #0A0E27;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .agent-container {
            width: 1400px;
            max-width: 95vw;
            height: 90vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.9) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* 聊天主区域 */
        .chat-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            position: relative;
        }

        /* 右侧成员面板 */
        .members-panel {
            width: 260px;
            flex-shrink: 0;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: 0.2s;
        }
        .members-panel-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid rgba(139,92,246,0.2);
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: #06B6D4;
            letter-spacing: 1px;
        }
        .members-list {
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(139,92,246,0.1);
            border-radius: 28px;
            border: 1px solid transparent;
            transition: 0.1s;
        }
        .member-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(145deg, #8B5CF6, #06B6D4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .member-name {
            font-size: 0.85rem;
            color: #E0E7FF;
            font-weight: 500;
        }
        .member-status {
            font-size: 0.65rem;
            color: #10B981;
            margin-left: auto;
        }
        .empty-members {
            color: #A5B4FC;
            font-size: 0.8rem;
            text-align: center;
            padding: 20px;
        }

        .sidebar-header {
            padding: 32px 20px 20px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }
        .sidebar-header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4, #EC4899);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .section-title {
            padding: 16px 20px 8px;
            font-size: 0.75rem;
            color: #06B6D4;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .agents-list, .rooms-list {
            padding: 0 12px 16px;
        }
        .agent-card, .room-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.1));
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .agent-card.active, .room-card.active {
            background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(6,182,212,0.3));
            border-color: #8B5CF6;
            box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }
        .agent-avatar, .room-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(145deg, #8B5CF6, #06B6D4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .agent-info, .room-info {
            flex: 1;
        }
        .agent-name, .room-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #E0E7FF;
        }
        .agent-status, .room-members {
            font-size: 0.65rem;
            color: #06B6D4;
        }
        .unread-dot {
            width: 8px;
            height: 8px;
            background: #EC4899;
            border-radius: 50%;
            box-shadow: 0 0 8px #EC4899;
        }
        .room-actions {
            padding: 16px;
            border-top: 1px solid rgba(139,92,246,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }
        .room-action-item {
            display: flex;
            gap: 8px;
        }
        .room-action-item input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 8px 12px;
            color: #E0E7FF;
            font-size: 0.75rem;
            outline: none;
        }
        .room-action-item button {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .chat-header {
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9), transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139,92,246,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-left h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #E0E7FF;
        }
        .chat-header-left span {
            font-size: 0.7rem;
            color: #A5B4FC;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .invite-btn {
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.5);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #E0E7FF;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139,92,246,0.2);
            padding: 5px 12px;
            border-radius: 40px;
        }
        .toggle-switch span {
            font-size: 0.7rem;
            color: #A5B4FC;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: #2d3748;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
        }
        input:checked + .slider:before { transform: translateX(22px); }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: rgba(139,92,246,0.1); border-radius: 3px; }
        .messages::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #8B5CF6, #06B6D4); border-radius: 3px; }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: messageSlide 0.3s ease-out;
        }
        .message.self {
            align-self: flex-end;
        }
        .message-meta {
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 4px;
            margin-left: 12px;
            color: #A5B4FC;
            letter-spacing: 0.3px;
        }
        .message.self .message-meta {
            text-align: right;
            margin-right: 12px;
        }
        .bubble {
            padding: 12px 20px;
            border-radius: 24px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #E0E7FF;
            word-wrap: break-word;
            font-size: 0.9rem;
            line-height: 1.5;
            transition: 0.1s;
        }
        .message.self .bubble {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            box-shadow: 0 2px 8px rgba(139,92,246,0.3);
        }
        
        /* ========= 统一 Markdown 渲染样式，解决字体大小不一致问题 ========= */
        .bubble * {
            font-size: inherit;
            line-height: inherit;
        }
        .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
            margin: 0.6em 0 0.3em;
            font-weight: 600;
            line-height: 1.3;
        }
        .bubble h1 { font-size: 1.3rem; }
        .bubble h2 { font-size: 1.2rem; }
        .bubble h3 { font-size: 1.1rem; }
        .bubble h4, .bubble h5, .bubble h6 { font-size: 1rem; }
        .bubble p {
            margin: 0.5em 0;
        }
        .bubble ul, .bubble ol {
            margin: 0.4em 0 0.6em 1.5em;
            padding-left: 0;
        }
        .bubble li {
            margin: 0.2em 0;
            line-height: 1.45;
        }
        .bubble code {
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #F0E6FF;
            word-break: break-word;
        }
        .bubble pre {
            background: #0A0E27;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            overflow-x: auto;
            margin: 0.7em 0;
            border: 1px solid rgba(139,92,246,0.3);
        }
        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 0.85rem;
            color: #D4D6FF;
            display: block;
            line-height: 1.5;
        }
        .bubble blockquote {
            border-left: 3px solid #8B5CF6;
            margin: 0.6em 0;
            padding-left: 1rem;
            color: #C4D0FF;
            font-style: normal;
            background: rgba(139,92,246,0.05);
            border-radius: 0 12px 12px 0;
        }
        .bubble a {
            color: #06B6D4;
            text-decoration: underline;
            font-weight: 500;
        }
        .bubble img {
            max-width: 100%;
            border-radius: 16px;
            margin: 0.5rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.6rem 0;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        .bubble th, .bubble td {
            border: 1px solid rgba(139,92,246,0.3);
            padding: 8px 12px;
            text-align: left;
        }
        .bubble th {
            background: rgba(139,92,246,0.2);
            font-weight: 600;
        }
        .bubble hr {
            margin: 0.8em 0;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #8B5CF6, #06B6D4, transparent);
        }
        .bubble strong {
            font-weight: 600;
            color: #FFFFFF;
        }
        .bubble em {
            font-style: italic;
            color: #C9D6FF;
        }
        /* 优化工具消息视觉效果 */
        .bubble:has(> strong:first-child:contains("🔧")), 
        .bubble:has(> p:first-child:contains("🔧")) {
            background: rgba(236,72,153,0.15);
            border-left: 3px solid #EC4899;
        }

        .input-zone {
            padding: 16px 24px 24px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9), transparent);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(139,92,246,0.2);
            position: relative;
        }
        .input-flex {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-box {
            flex: 1;
            background: rgba(0,0,0,0.35);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.1s;
        }
        .input-box:focus-within {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 2px rgba(139,92,246,0.3);
        }
        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: #E0E7FF;
            font-size: 0.85rem;
            outline: none;
            resize: none;
            font-family: 'Exo 2', monospace;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #A5B4FC;
            transition: 0.1s;
        }
        .icon-btn:hover {
            background: rgba(139,92,246,0.3);
            color: white;
        }
        #sendBtn {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.1s;
        }
        #sendBtn:hover {
            transform: scale(0.98);
            box-shadow: 0 0 10px rgba(139,92,246,0.6);
        }
        .preview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 24px 0;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 5px 16px;
            width: fit-content;
        }
        .preview-img {
            max-height: 40px;
            border-radius: 12px;
        }
        .status {
            text-align: center;
            font-size: 0.65rem;
            color: #A5B4FC;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* 审批弹窗优化 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .approval-panel {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(10, 14, 39, 0.98));
            border: 1px solid rgba(139, 92, 246, 0.6);
            border-radius: 28px;
            padding: 24px 28px;
            width: 500px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .approval-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(139,92,246,0.3);
        }
        .approval-header h3 {
            font-family: 'Orbitron', monospace;
            color: #EC4899;
            font-size: 1.2rem;
        }
        .close-approval {
            background: none;
            border: none;
            color: #A5B4FC;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .approval-content {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            font-family: monospace;
            font-size: 0.8rem;
            color: #E0E7FF;
            border-left: 3px solid #8B5CF6;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .approval-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .approval-btn {
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            border: none;
        }
        .approve-btn { background: linear-gradient(135deg, #10B981, #059669); color: white; }
        .reject-btn { background: linear-gradient(135deg, #EF4444, #B91C1C); color: white; }
        .edit-btn { background: linear-gradient(135deg, #F59E0B, #D97706); color: white; }
        .edit-args-input {
            width: 100%;
            background: #0A0E27;
            border: 1px solid rgba(139,92,246,0.4);
            border-radius: 16px;
            padding: 10px;
            color: #E0E7FF;
            font-family: monospace;
            font-size: 0.75rem;
            margin-top: 12px;
            resize: vertical;
        }
        .submit-edit {
            background: #8B5CF6;
            margin-top: 8px;
            width: 100%;
            padding: 6px;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
        }

        /* 快捷输入浮层 */
        .suggest-dropdown, .invite-dropdown {
            position: absolute;
            bottom: 70px;
            left: 30px;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139,92,246,0.5);
            border-radius: 20px;
            padding: 8px 0;
            width: 220px;
            z-index: 300;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .invite-dropdown {
            left: auto;
            right: 20px;
            bottom: auto;
            top: 70px;
        }
        .suggest-item {
            padding: 8px 16px;
            cursor: pointer;
            color: #E0E7FF;
            font-size: 0.85rem;
            transition: 0.1s;
        }
        .suggest-item:hover {
            background: rgba(139,92,246,0.3);
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 代码块复制按钮 */
        .bubble pre {
            position: relative;
            overflow: visible;
        }
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(139, 92, 246, 0.7);
            border: none;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-weight: 500;
            transition: 0.1s;
            z-index: 5;
            font-family: 'Exo 2', monospace;
        }
        .copy-code-btn:hover {
            background: #8B5CF6;
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div class="grid-background"></div>
<div class="agent-container">
    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AgentPro</h1>
            <p style="font-size:0.7rem; color:#A5B4FC;">intelligent swarm</p>
        </div>
        <div class="section-title">🤖 智能体伙伴</div>
        <div class="agents-list" id="agentsList"></div>
        <div class="section-title">🏠 群聊房间</div>
        <div class="rooms-list" id="roomsList"></div>
        <div class="room-actions">
            <div class="room-action-item">
                <input type="text" id="createRoomInput" placeholder="房间ID">
                <button id="createRoomBtn">创建</button>
            </div>
            <div class="room-action-item">
                <input type="text" id="joinRoomInput" placeholder="房间ID">
                <button id="joinRoomBtn">加入</button>
            </div>
        </div>
    </div>

    <!-- 中间聊天区域 -->
    <div class="chat-main">
        <div class="chat-header">
            <div class="chat-header-left">
                <h2 id="currentChatName">未选择</h2>
                <span id="currentChatMeta">就绪</span>
            </div>
            <div class="header-actions">
                <button id="inviteAgentBtn" class="invite-btn" style="display: none;">➕ 邀请Agent</button>
                <div class="toggle-switch">
                    <span>工具调用</span>
                    <label class="switch">
                        <input type="checkbox" id="toggleToolCalls" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <div id="imagePreview" class="preview-bar" style="display: none;">
            <img id="previewImg" class="preview-img">
            <button id="removeImageBtn" class="remove-img" style="background:none; border:none; color:#EC4899;">✖</button>
        </div>
        <div class="input-zone" id="inputZone">
            <div class="input-flex">
                <div class="input-box">
                    <textarea id="messageInput" rows="1" placeholder="输入消息... @提及Agent  /new 新话题" disabled></textarea>
                </div>
                <div class="btn-group">
                    <button id="imageBtn" class="icon-btn" title="发送图片">📷</button>
                    <button id="sendBtn" disabled>发送</button>
                </div>
            </div>
            <div class="status" id="connectionStatus">⚡ 初始化</div>
        </div>
    </div>

    <!-- 右侧成员面板 -->
    <div class="members-panel" id="membersPanel" style="display: none;">
        <div class="members-panel-header">
            👥 群成员
        </div>
        <div class="members-list" id="membersList">
            <div class="empty-members">暂无成员</div>
        </div>
    </div>
</div>

<input type="file" id="imageInput" accept="image/*" style="display: none;">

<!-- 审批遮罩 -->
<div id="approvalModalOverlay" class="modal-overlay">
    <div class="approval-panel">
        <div class="approval-header">
            <h3>🔐 工具调用审批</h3>
            <button class="close-approval" id="closeApprovalBtn">&times;</button>
        </div>
        <div id="approvalContent" class="approval-content"></div>
        <div class="approval-buttons">
            <button id="approveBtn" class="approval-btn approve-btn">✅ 批准</button>
            <button id="rejectBtn" class="approval-btn reject-btn">❌ 拒绝</button>
            <button id="editBtn" class="approval-btn edit-btn">✏️ 修改参数</button>
        </div>
        <input type="text" id="editArgsInput" class="edit-args-input" placeholder='修改后的参数 (JSON格式)' style="display:none;">
        <button id="submitEditBtn" class="submit-edit" style="display:none;">提交修改</button>
    </div>
</div>

<script>
    let ws = null;
    let currentAgent = null;
    let currentRoom = null;
    let agents = [];
    let rooms = {};
    let messageHistory = {};
    let roomMessages = {};
    let currentImageBase64 = null;
    let pendingApproval = null;
    let showToolCalls = true;
    let onlineAgentsSet = new Set();

    // DOM
    const agentsContainer = document.getElementById('agentsList');
    const roomsContainer = document.getElementById('roomsList');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentChatNameSpan = document.getElementById('currentChatName');
    const currentChatMetaSpan = document.getElementById('currentChatMeta');
    const connStatusSpan = document.getElementById('connectionStatus');
    const previewDiv = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImgBtn = document.getElementById('removeImageBtn');
    const imageInput = document.getElementById('imageInput');
    const imageBtn = document.getElementById('imageBtn');
    const toggleSwitch = document.getElementById('toggleToolCalls');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const createRoomInput = document.getElementById('createRoomInput');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const inviteAgentBtn = document.getElementById('inviteAgentBtn');
    const membersPanel = document.getElementById('membersPanel');
    const membersListDiv = document.getElementById('membersList');

    // approval
    const modalOverlay = document.getElementById('approvalModalOverlay');
    const approvalContentDiv = document.getElementById('approvalContent');
    const approveBtn = document.getElementById('approveBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const editBtn = document.getElementById('editBtn');
    const editArgsInput = document.getElementById('editArgsInput');
    const submitEditBtn = document.getElementById('submitEditBtn');
    const closeApprovalBtn = document.getElementById('closeApprovalBtn');

    marked.setOptions({ breaks: true, gfm: true });

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function isToolMessage(text) { return text && (text.startsWith('🔧') || text.startsWith('🛠️')); }

    async function saveMessage(threadId, role, content) { try { await fetch('/chat/history', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ thread_id:threadId, role, content }) }); } catch(e){} }
    async function loadHistory(threadId) { try { const resp = await fetch(`/chat/history?thread_id=${encodeURIComponent(threadId)}&limit=200`); return await resp.json(); } catch(e){ return []; } }
    async function loadAgentHistory(agentId) {
        const threadId = `private_${agentId}_super_user`;
        const history = await loadHistory(threadId);
        if(!messageHistory[agentId]) messageHistory[agentId] = [];
        for(let msg of history) messageHistory[agentId].push({ sender: msg.role === 'user' ? '我' : agentId, text: msg.content, time: new Date(msg.created_at).toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' }) });
    }

    function renderAgents() {
        agentsContainer.innerHTML = '';
        agents.forEach(agent => {
            const card = document.createElement('div');
            card.className = `agent-card ${currentAgent === agent && !currentRoom ? 'active' : ''}`;
            card.innerHTML = `<div class="agent-avatar">🤖</div><div class="agent-info"><div class="agent-name">${escapeHtml(agent)}</div><div class="agent-status">在线</div></div>`;
            card.onclick = () => selectAgent(agent);
            agentsContainer.appendChild(card);
        });
    }

    async function selectAgent(agent) {
        if(currentRoom) { currentRoom = null; renderRooms(); hideMembersPanel(); }
        currentAgent = agent;
        currentChatNameSpan.innerText = agent;
        currentChatMetaSpan.innerText = '对话中';
        messageInput.disabled = false; sendBtn.disabled = false;
        inviteAgentBtn.style.display = 'none';
        renderAgents();
        if(!messageHistory[agent]) { messageHistory[agent] = []; await loadAgentHistory(agent); }
        loadMessages(agent);
        messageInput.focus();
    }

    function loadMessages(agentId) {
        messagesDiv.innerHTML = '';
        (messageHistory[agentId] || []).forEach(msg => { if(!showToolCalls && isToolMessage(msg.text)) return; displayMessage(msg.sender, msg.text, msg.time); });
        addCopyButtonsToCodeBlocks();
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function displayMessage(sender, text, time) {
        const isSelf = (sender === '我');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSelf ? 'self' : ''}`;
        const rendered = marked.parse(text);
        msgDiv.innerHTML = `<div class="message-meta">${escapeHtml(isSelf ? '我' : sender)} · ${escapeHtml(time || new Date().toLocaleTimeString())}</div><div class="bubble">${rendered}</div>`;
        messagesDiv.appendChild(msgDiv);
        addCopyButtonsToCodeBlocks();
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        let text = messageInput.value.trim();
        if (!text && !currentImageBase64) return;
        let newThread = false;
        if (text.startsWith('/new')) { newThread = true; text = text.substring(4).trim() || "新对话"; }
        const time = new Date().toLocaleTimeString();

        if (text && currentAgent) {
            saveMessage(`private_${currentAgent}_super_user`, 'user', text);
            if (!messageHistory[currentAgent]) messageHistory[currentAgent] = [];
            messageHistory[currentAgent].push({ sender: '我', text, time });
            displayMessage('我', text, time);
            ws.send(JSON.stringify({ type: 'send', to: currentAgent, text, image: currentImageBase64 || null, new_thread: newThread }));
        }
        else if (currentRoom) {
            if (!roomMessages[currentRoom]) roomMessages[currentRoom] = [];
            roomMessages[currentRoom].push({ sender: '我', text, time });
            displayMessage('我', text, time);
            ws.send(JSON.stringify({ type: 'group_message', room_id: currentRoom, text: text, image: currentImageBase64 || null }));
        }

        messageInput.value = '';
        currentImageBase64 = null;
        previewDiv.style.display = 'none';
        imageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    function renderRooms() {
        roomsContainer.innerHTML = '';
        for(let roomId in rooms) {
            const room = rooms[roomId];
            const card = document.createElement('div');
            card.className = `room-card ${currentRoom === roomId && !currentAgent ? 'active' : ''}`;
            card.innerHTML = `<div class="room-avatar">🏠</div><div class="room-info"><div class="room-name">${escapeHtml(roomId)}</div><div class="room-members">${room.members?.length || 0} 人</div></div>${room.unread ? '<div class="unread-dot"></div>' : ''}`;
            card.onclick = () => {
                if(currentAgent) { currentAgent = null; renderAgents(); }
                currentRoom = roomId;
                currentChatNameSpan.innerText = roomId;
                currentChatMetaSpan.innerText = '群聊';
                messageInput.disabled = false; sendBtn.disabled = false;
                inviteAgentBtn.style.display = 'flex';
                renderRooms();
                showMembersPanel();
                loadRoomMessages(roomId);
                if(rooms[roomId]) rooms[roomId].unread = false;
                if(ws) ws.send(JSON.stringify({ type:'get_room_members', room_id: roomId }));
            };
            roomsContainer.appendChild(card);
        }
    }

    function loadRoomMessages(roomId) {
        messagesDiv.innerHTML = '';
        (roomMessages[roomId] || []).forEach(msg => { if(!showToolCalls && isToolMessage(msg.text)) return; displayMessage(msg.sender, msg.text, msg.time); });
        addCopyButtonsToCodeBlocks();
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateMembersPanel(members) {
        membersListDiv.innerHTML = '';
        if (!members || members.length === 0) {
            membersListDiv.innerHTML = '<div class="empty-members">暂无成员</div>';
            return;
        }
        const isWsConnected = (ws && ws.readyState === WebSocket.OPEN);
        members.forEach(m => {
            let isOnline = false;
            let displayName = m;
            let avatar = '🤖';
            if (m === 'super_user') {
                isOnline = isWsConnected;
                displayName = '我';
                avatar = '👤';
            } else {
                isOnline = onlineAgentsSet.has(m);
            }
            const statusText = isOnline ? '在线' : '离线';
            const statusColor = isOnline ? '#10B981' : '#6B7280';
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-item';
            memberDiv.innerHTML = `
                <div class="member-avatar">${avatar}</div>
                <div class="member-name">${escapeHtml(displayName)}</div>
                <div class="member-status" style="color: ${statusColor};">${statusText}</div>
            `;
            membersListDiv.appendChild(memberDiv);
        });
    }

    function showMembersPanel() { membersPanel.style.display = 'flex'; }
    function hideMembersPanel() { membersPanel.style.display = 'none'; }

    function showInviteDropdown() {
        if(!currentRoom) return;
        const existing = rooms[currentRoom]?.members || [];
        const available = agents.filter(a => !existing.includes(a));
        if(available.length===0) { connStatusSpan.innerText = '无可用Agent邀请'; return; }
        let dropdown = document.querySelector('.invite-dropdown');
        if(dropdown) dropdown.remove();
        const div = document.createElement('div');
        div.className = 'invite-dropdown';
        div.innerHTML = `<h4 style="padding:8px 12px; color:#06B6D4;">邀请加入</h4>`;
        available.forEach(ag => {
            const item = document.createElement('div');
            item.className = 'suggest-item';
            item.innerText = `🤖 ${ag}`;
            item.onclick = () => {
                ws.send(JSON.stringify({ type: 'invite_to_room', room_id: currentRoom, target_agent: ag }));
                connStatusSpan.innerText = `邀请 ${ag} 加入...`;
                div.remove();
            };
            div.appendChild(item);
        });
        document.body.appendChild(div);
        setTimeout(() => document.addEventListener('click', function remove(e){ if(!div.contains(e.target) && e.target !== inviteAgentBtn) { div.remove(); document.removeEventListener('click', remove); } }), 10);
    }

    let suggestDropdown = null;
    function closeSuggest() { if(suggestDropdown) { suggestDropdown.remove(); suggestDropdown = null; } }
    function showSuggest(items, onSelect) {
        closeSuggest();
        const rect = messageInput.getBoundingClientRect();
        const div = document.createElement('div');
        div.className = 'suggest-dropdown';
        items.forEach(item => {
            const opt = document.createElement('div');
            opt.className = 'suggest-item';
            opt.innerText = item;
            opt.onclick = () => { onSelect(item); closeSuggest(); messageInput.focus(); };
            div.appendChild(opt);
        });
        document.body.appendChild(div);
        div.style.bottom = `${window.innerHeight - rect.top + 10}px`;
        div.style.left = `${rect.left}px`;
        suggestDropdown = div;
        setTimeout(() => { const handleClick = (e) => { if(!div.contains(e.target) && e.target !== messageInput) closeSuggest(); document.removeEventListener('click', handleClick); }; document.addEventListener('click', handleClick); }, 0);
    }
    messageInput.addEventListener('input', function(e) {
        const val = this.value;
        const cursorPos = this.selectionStart;
        const beforeCursor = val.slice(0, cursorPos);
        const lastAtIndex = beforeCursor.lastIndexOf('@');
        const lastSlash = beforeCursor.lastIndexOf('/');
        if(lastAtIndex !== -1 && lastAtIndex === beforeCursor.length - 1) {
            const availableAgents = agents.filter(a => a !== 'super_user');
            showSuggest(availableAgents, (selected) => {
                const newVal = val.slice(0, lastAtIndex) + '@' + selected + ' ' + val.slice(cursorPos);
                messageInput.value = newVal;
                messageInput.selectionStart = messageInput.selectionEnd = lastAtIndex + selected.length + 2;
                messageInput.dispatchEvent(new Event('input'));
            });
        } else if(lastSlash !== -1 && lastSlash === beforeCursor.length-1 && val[lastSlash] === '/') {
            showSuggest(['/new '], (cmd) => {
                const newVal = val.slice(0, lastSlash) + cmd + ' ';
                messageInput.value = newVal;
                messageInput.selectionStart = messageInput.selectionEnd = newVal.length;
            });
        } else { closeSuggest(); }
    });
    messageInput.addEventListener('blur', () => setTimeout(closeSuggest, 200));

    function connect() {
        ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.onopen = () => { connStatusSpan.innerText = '● 已连接'; connStatusSpan.style.color = '#06B6D4'; ws.send(JSON.stringify({ type:'list_rooms' })); updateMembersPanel(rooms[currentRoom]?.members || []);};
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'agents') {
                agents = (data.agents || []).filter(a => a !== 'super_user');
                onlineAgentsSet.clear();
                agents.forEach(a => onlineAgentsSet.add(a));
                renderAgents();
                if (currentRoom && rooms[currentRoom]) updateMembersPanel(rooms[currentRoom].members);
            } else if(data.type === 'message') {
                const from=data.from, text=data.text, time=new Date().toLocaleTimeString();
                saveMessage(`private_${from}_super_user`, 'assistant', text);
                if(!messageHistory[from]) messageHistory[from]=[];
                messageHistory[from].push({ sender:from, text, time });
                if(currentAgent===from && (showToolCalls || !isToolMessage(text))) displayMessage(from,text,time);
                else renderAgents();
            } else if (data.type === 'group_message') {
                const rid = data.room_id;
                const from = data.from;
                let text = data.text || (data.payload?.text);
                if (!text) return;
                const time = new Date().toLocaleTimeString();
                if (!roomMessages[rid]) roomMessages[rid] = [];
                roomMessages[rid].push({ sender: from, text, time });
                if (currentRoom === rid && (showToolCalls || !isToolMessage(text))) displayMessage(from, text, time);
                else if (rooms[rid]) rooms[rid].unread = true;
                renderRooms();
            } else if(data.type === 'room_members_update' || data.type === 'room_members') {
                const rid = data.room_id;
                const members = data.members;
                if(!rooms[rid]) rooms[rid] = { members: [], unread: false };
                rooms[rid].members = members;
                if(currentRoom === rid) updateMembersPanel(members);
                renderRooms();
            } else if(data.type === 'rooms_list') {
                (data.rooms || []).forEach(rid => { if(!rooms[rid]) rooms[rid]={ members:[], unread:false }; });
                renderRooms();
            } else if(data.type === 'room_created' || data.type === 'room_joined') {
                if(!rooms[data.room_id]) rooms[data.room_id]={ members:[], unread:false };
                renderRooms();
                if(currentRoom === data.room_id) ws.send(JSON.stringify({ type:'get_room_members', room_id: data.room_id }));
            } else if(data.type === 'approval_request') {
                pendingApproval = { tool:data.tool, args:data.args, allowed:data.allowed, fromAgent:data.from };
                approvalContentDiv.innerHTML = `<strong>🔐 工具调用需要审批</strong><br>工具: ${escapeHtml(data.tool)}<br>参数: <pre style="margin-top:6px;">${JSON.stringify(data.args, null, 2)}</pre><br>允许操作: ${data.allowed.join(', ')}`;
                modalOverlay.classList.add('active');
            }
        };
        ws.onclose = () => { connStatusSpan.innerText = '● 断开重连'; connStatusSpan.style.color='#EC4899'; setTimeout(connect,3000); if (currentRoom) updateMembersPanel(rooms[currentRoom]?.members || []);};
    }

    function closeApprovalModal() { modalOverlay.classList.remove('active'); editArgsInput.style.display='none'; submitEditBtn.style.display='none'; editBtn.style.display='inline-block'; pendingApproval=null; }
    approveBtn.onclick = () => { if(pendingApproval){ ws.send(JSON.stringify({ type:'approval_decision', to:pendingApproval.fromAgent, tool:pendingApproval.tool, decision:'approve' })); closeApprovalModal(); } };
    rejectBtn.onclick = () => { if(pendingApproval){ ws.send(JSON.stringify({ type:'approval_decision', to:pendingApproval.fromAgent, tool:pendingApproval.tool, decision:'reject' })); closeApprovalModal(); } };
    editBtn.onclick = () => { editArgsInput.style.display='block'; submitEditBtn.style.display='inline-block'; editBtn.style.display='none'; editArgsInput.value = JSON.stringify(pendingApproval.args, null, 2); };
    submitEditBtn.onclick = () => { try{ const edited = JSON.parse(editArgsInput.value); ws.send(JSON.stringify({ type:'approval_decision', to:pendingApproval.fromAgent, tool:pendingApproval.tool, decision:'edit', edited_args:edited })); closeApprovalModal(); } catch(e){ alert('JSON 格式错误'); } };
    closeApprovalBtn.onclick = closeApprovalModal;

    createRoomBtn.onclick = () => { const rid=createRoomInput.value.trim(); if(rid){ ws.send(JSON.stringify({ type:'create_room', room_id:rid, target_agent:'super_user' })); createRoomInput.value=''; } };
    joinRoomBtn.onclick = () => { const rid=joinRoomInput.value.trim(); if(rid){ ws.send(JSON.stringify({ type:'join_room', room_id:rid, target_agent:'super_user' })); joinRoomInput.value=''; } };
    imageBtn.onclick = () => imageInput.click();
    imageInput.onchange = (e) => { const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onload=(ev)=>{ currentImageBase64=ev.target.result.split(',')[1]; previewImg.src=ev.target.result; previewDiv.style.display='flex'; }; reader.readAsDataURL(file); } };
    removeImgBtn.onclick = () => { currentImageBase64=null; previewDiv.style.display='none'; imageInput.value=''; };
    toggleSwitch.onchange = (e) => { showToolCalls=e.target.checked; if(currentAgent) loadMessages(currentAgent); else if(currentRoom) loadRoomMessages(currentRoom); };
    sendBtn.onclick = sendMessage;
    messageInput.addEventListener('keydown', (e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
    messageInput.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,100)+'px'; });
    inviteAgentBtn.onclick = showInviteDropdown;

    // 为所有代码块添加复制按钮
    function addCopyButtonsToCodeBlocks() {
        const messageContainers = document.querySelectorAll('.message .bubble');
        messageContainers.forEach(container => {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                // 避免重复添加按钮
                if (pre.querySelector('.copy-code-btn')) return;
                // 只对包含 code 的 pre 添加
                const codeElem = pre.querySelector('code');
                if (!codeElem) return;

                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.innerText = '复制';
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const code = codeElem.innerText;
                    try {
                        await navigator.clipboard.writeText(code);
                        btn.innerText = '已复制!';
                        setTimeout(() => { btn.innerText = '复制'; }, 1500);
                    } catch (err) {
                        btn.innerText = '失败';
                        setTimeout(() => { btn.innerText = '复制'; }, 1500);
                    }
                };
                // 确保 pre 定位方式支持绝对定位子元素
                if (getComputedStyle(pre).position === 'static') {
                    pre.style.position = 'relative';
                }
                pre.appendChild(btn);
            });
        });
    }
    connect();
</script>
</body>
</html>
