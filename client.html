<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AgentPro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: calc(16px * var(--font-scale, 1)); }

        :root {
            --bg: #faf9f7;
            --sidebar-bg: #f3f1ee;
            --surface: #ffffff;
            --border: #e8e6e1;
            --border-light: #f0eeea;
            --accent: #5b5fef;
            --accent-hover: #4a4fd9;
            --accent-light: rgba(91,95,239,0.08);
            --accent-glow: rgba(91,95,239,0.2);
            --text: #1a1a1a;
            --text-muted: #8e8e93;
            --text-secondary: #6b7280;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --success: #059669;
            --radius: 10px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --radius-pill: 24px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.06), 0 4px 8px rgba(0,0,0,0.04);
            --shadow-glow: 0 0 20px rgba(91,95,239,0.15);
            --glass-subtle: rgba(255,255,255,0.45);
            --glass-medium: rgba(255,255,255,0.65);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-scale: 1;
        }

        /* ── Dark theme ── */
        [data-theme="dark"] {
            --bg: #0a0a0f;
            --sidebar-bg: #0e0e15;
            --surface: #16161f;
            --border: #22222e;
            --border-light: #1a1a26;
            --accent: #7b7fff;
            --accent-hover: #9696ff;
            --accent-light: rgba(123,127,255,0.1);
            --accent-glow: rgba(123,127,255,0.25);
            --text: #e5e5ea;
            --text-muted: #8e8e98;
            --text-secondary: #b0b0ba;
            --danger: #ff5a5a;
            --danger-light: rgba(255,90,90,0.1);
            --success: #34d399;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
            --shadow: 0 1px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 30px rgba(123,127,255,0.2);
            --glass-subtle: rgba(22,22,31,0.55);
            --glass-medium: rgba(22,22,31,0.7);
        }
        [data-theme="dark"] .chat-header,
        [data-theme="dark"] .input-zone { background: var(--glass-medium); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        [data-theme="dark"] .bubble pre { background: rgba(0,0,0,0.4); border-color: transparent; }
        [data-theme="dark"] .bubble code { background: rgba(255,255,255,0.08); color: #ff8c8c; }
        [data-theme="dark"] .bubble blockquote { background: rgba(123,127,255,0.06); }
        [data-theme="dark"] .bubble th { background: rgba(123,127,255,0.12); }
        [data-theme="dark"] .approval-content { background: #0a0a0f; }
        [data-theme="dark"] .edit-args-input { background: #0a0a0f; }
        [data-theme="dark"] .member-item { background: #16161f; }
        [data-theme="dark"] .skeleton-line {
            background: linear-gradient(90deg, #16161f 25%, #22222e 50%, #16161f 75%);
        }
        [data-theme="dark"] .agent-item:hover { background: rgba(123,127,255,0.06); }
        [data-theme="dark"] .invite-btn { background: rgba(123,127,255,0.12); border-color: rgba(123,127,255,0.2); }
        [data-theme="dark"] .suggest-dropdown,
        [data-theme="dark"] .invite-dropdown { box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        [data-theme="dark"] .copy-code-btn { background: rgba(123,127,255,0.2); border-color: rgba(123,127,255,0.25); }
        [data-theme="dark"] .sidebar { border-right-color: var(--border); }
        [data-theme="dark"] .settings-divider { background: var(--border); }
        [data-theme="dark"] .new-chat-btn { box-shadow: 0 2px 8px rgba(123,127,255,0.25); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        /* 噪点纹理叠加层 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
        }
        /* 氛围光晕 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(91,95,239,0.06) 0%, transparent 70%);
        }
        [data-theme="dark"] body::after {
            background: radial-gradient(ellipse 50% 40% at 50% 0%, rgba(123,127,255,0.1) 0%, transparent 70%);
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .sidebar-header {
            padding: 22px 16px 14px;
            flex-shrink: 0;
        }
        .sidebar-header .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 40%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 2px 4px rgba(91,95,239,0.15));
        }
        .sidebar-header .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 1px;
            letter-spacing: 0.2px;
        }

        /* Agent list */
        .agent-select-area {
            padding: 0 12px 10px;
            flex-shrink: 0;
        }
        .agent-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px 5px;
        }
        .agent-section-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .agent-count {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: 9px;
            padding: 1px 7px;
            line-height: 1.4;
        }
        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .agent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s var(--spring);
            font-size: 0.88rem;
            color: var(--text);
            position: relative;
        }
        .agent-item:hover { background: var(--surface); padding-left: 12px; }
        .agent-item.active { background: var(--accent-light); font-weight: 500; box-shadow: inset 2px 0 0 var(--accent); }
        .agent-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .agent-dot.online { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); animation: dotPulse 2s ease-in-out infinite; }
        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 4px rgba(16,185,129,0.4); }
            50% { box-shadow: 0 0 10px rgba(16,185,129,0.7); }
        }
        .agent-dot.offline { background: var(--text-muted); }
        .agent-item .agent-icon {
            font-size: 1rem;
            flex-shrink: 0;
            line-height: 1;
        }
        .agent-item .agent-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .agent-item .agent-unread {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            display: none;
        }
        .agent-item.has-unread .agent-unread { display: block; }
        .agent-item .agent-close-btn {
            display: none;
            width: 18px; height: 18px;
            line-height: 18px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
            padding: 0;
            transition: all 0.15s;
        }
        .agent-item .agent-close-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        .agent-item:hover .agent-close-btn {
            display: block;
        }
        .agent-empty {
            font-size: 0.76rem;
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0;
        }
        .agent-launch-btn {
            width: 20px; height: 20px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            border-radius: 4px;
            transition: color 0.12s, background 0.12s;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .agent-launch-btn:hover { color: var(--accent); background: var(--accent-light); }
        .launch-form {
            padding: 6px 0 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .launch-form input {
            width: 100%;
            padding: 6px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.76rem;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
        }
        .launch-form input:focus { border-color: var(--accent); }
        .launch-form .launch-actions {
            display: flex;
            gap: 4px;
        }
        .launch-form .launch-actions button {
            flex: 1;
            padding: 5px 0;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.74rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.12s;
        }
        .launch-form .btn-launch {
            background: var(--accent);
            color: #fff;
        }
        .launch-form .btn-launch:hover { opacity: 0.9; }
        .launch-form .btn-launch:disabled { opacity: 0.5; cursor: not-allowed; }
        .launch-form .btn-cancel {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* New Chat button */
        .new-chat-btn {
            margin: 0 12px 10px;
            padding: 10px 0;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.84rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s var(--spring);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(91,95,239,0.25);
        }
        .new-chat-btn:hover { background: linear-gradient(135deg, var(--accent-hover) 0%, #7c3aed 100%); box-shadow: 0 4px 16px rgba(91,95,239,0.35); transform: translateY(-1px); }
        .new-chat-btn:active { transform: translateY(0); }
        .new-chat-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; transform: none; }

        /* Conversation list */
        .conv-list-label {
            padding: 6px 16px 4px;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2px 8px 8px;
        }
        .conv-list::-webkit-scrollbar { width: 4px; }
        .conv-list::-webkit-scrollbar-track { background: transparent; }
        .conv-list::-webkit-scrollbar-thumb { background: #d0d0d5; border-radius: 2px; }

        .conv-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s var(--spring);
            margin-bottom: 1px;
            position: relative;
            gap: 6px;
        }
        .conv-item:hover { background: rgba(91,95,239,0.04); padding-left: 10px; }
        .conv-item.active { background: var(--accent-light); box-shadow: inset 2px 0 0 var(--accent); }
        .conv-item .conv-title {
            flex: 1;
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            line-height: 1.3;
        }
        .conv-item.active .conv-title { color: var(--accent); font-weight: 500; }
        .conv-item .conv-time {
            font-size: 0.62rem;
            color: var(--text-muted);
            flex-shrink: 0;
            letter-spacing: 0.1px;
        }
        .conv-item .conv-delete {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 5px;
            border-radius: 5px;
            transition: opacity 0.15s, color 0.12s, background 0.12s;
            line-height: 1;
        }
        .conv-item .conv-edit {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 5px;
            border-radius: 5px;
            transition: opacity 0.15s, color 0.12s, background 0.12s;
            line-height: 1;
        }
        .conv-item:hover .conv-delete,
        .conv-item:hover .conv-edit { opacity: 1; }
        .conv-item .conv-delete:hover { color: var(--danger); background: var(--danger-light); border-color: #fecaca; }
        .conv-item .conv-edit:hover { color: var(--accent); background: var(--accent-light); border-color: var(--accent-glow); }
        [data-theme="dark"] .conv-item .conv-delete:hover { border-color: rgba(239,68,68,0.3); }
        [data-theme="dark"] .conv-item .conv-edit:hover { border-color: rgba(123,127,255,0.25); }

        /* Empty conv state */
        .conv-empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Sidebar footer */
        .sidebar-footer {
            padding: 8px 16px;
            border-top: 1px solid var(--border);
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-footer .dot {
            width: 6px; height: 6px;
            background: var(--success);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sidebar-footer .rooms-toggle {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            padding: 2px 8px;
            border-radius: 4px;
            transition: color 0.12s, background 0.12s;
        }
        .sidebar-footer .rooms-toggle:hover { color: var(--text); background: rgba(0,0,0,0.04); }
        [data-theme="dark"] .sidebar-footer .rooms-toggle:hover { background: rgba(255,255,255,0.06); }

        /* Settings row */
        .settings-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .settings-btn {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
            font-family: inherit;
        }
        .settings-btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }
        [data-theme="dark"] .settings-btn:hover { background: rgba(255,255,255,0.06); }
        .settings-btn.active { color: var(--accent); }
        .settings-divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
        .font-size-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin: 0 2px;
            user-select: none;
        }

        /* Rooms section (collapsible with vertical animation) */
        .rooms-section {
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rooms-section.open { max-height: 320px; overflow-y: auto; }
        .rooms-section .section-title {
            padding: 8px 16px 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .room-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: background 0.12s;
        }
        .room-item:hover { background: var(--accent-light); }
        .room-item.active { background: var(--accent-light); }
        .room-item .unread-dot {
            width: 7px; height: 7px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: auto;
            flex-shrink: 0;
        }
        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px 12px 10px;
        }
        .room-action-row {
            display: flex;
            gap: 6px;
        }
        .room-action-row input {
            width: 180px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text);
            font-size: 0.72rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .room-action-row input:focus { border-color: var(--accent); }
        .room-action-row button {
            width: 56px;
            flex-shrink: 0;
            background: var(--accent);
            border: none;
            padding: 6px 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            white-space: nowrap;
            font-weight: 500;
            transition: background 0.12s;
            text-align: center;
        }
        .room-action-row button:hover { background: var(--accent-hover); }

        /* ── Main Chat ── */
        .chat-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
            z-index: 1;
        }
        .chat-header {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--glass-medium);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .chat-header-left h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.2px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.12s;
            margin: -2px -8px;
        }
        .chat-header-left h2:hover { background: rgba(0,0,0,0.04); }
        [data-theme="dark"] .chat-header-left h2:hover { background: rgba(255,255,255,0.04); }
        .chat-header-left h2.editing { background: transparent; cursor: text; }
        .title-edit-input {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            outline: none;
            letter-spacing: -0.2px;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .chat-header-left span {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .invite-btn {
            background: var(--accent-light);
            border: 1px solid var(--accent-glow);
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.76rem;
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            display: none;
            transition: background 0.12s;
        }
        .invite-btn:hover { background: var(--accent-light); }

        /* Tool calls toggle */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.73rem;
            color: var(--text-muted);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #d1d1d6;
            border-radius: 20px;
            transition: 0.2s;
        }
        .switch .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 2px; bottom: 2px;
            background: #fff;
            border-radius: 50%;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider:before { transform: translateX(14px); }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #d0d0d5; border-radius: 3px; }

        /* 新消息提示条 */
        .scroll-bottom-hint {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            margin-top: -40px;
            height: 0;
        }
        .scroll-bottom-hint.visible { height: auto; }
        .scroll-bottom-hint-inner {
            pointer-events: auto;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-pill);
            padding: 7px 18px;
            font-size: 0.78rem;
            color: var(--accent);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s var(--spring);
            animation: hintIn 0.25s var(--spring) forwards;
            white-space: nowrap;
            user-select: none;
        }
        .scroll-bottom-hint-inner:hover {
            background: var(--accent-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-1px);
        }
        @keyframes hintIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .empty-chat {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            user-select: none;
            opacity: 0.6;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: messageIn 0.35s var(--spring) forwards;
            opacity: 0;
        }
        .message:nth-child(1) { animation-delay: 0s; }
        .message:nth-child(2) { animation-delay: 0.04s; }
        .message:nth-child(3) { animation-delay: 0.08s; }
        .message:nth-child(4) { animation-delay: 0.12s; }
        .message:nth-child(5) { animation-delay: 0.16s; }
        .message:nth-child(n+6) { animation-delay: 0.2s; }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.self { align-self: flex-end; }
        .message-meta {
            font-size: 0.66rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            margin-left: 10px;
            letter-spacing: 0.1px;
            opacity: 0.75;
        }
        .message.self .message-meta {
            text-align: right;
            margin-left: 0;
            margin-right: 10px;
        }
        .bubble {
            padding: 11px 18px;
            border-radius: 16px 16px 16px 4px;
            background: var(--glass-medium);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
            color: var(--text);
            word-wrap: break-word;
            font-size: 0.88rem;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
        }
        .message.self .bubble {
            border-radius: 16px 16px 4px 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #7c5ce7 100%);
            border: none;
            color: #fff;
            box-shadow: 0 2px 12px rgba(91,95,239,0.3), 0 0 0 1px rgba(255,255,255,0.1) inset;
        }

        /* Markdown styles inside bubble */
        .bubble * { font-size: inherit; line-height: inherit; }
        .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
            margin: 0.5em 0 0.2em;
            font-weight: 600;
            line-height: 1.3;
        }
        .bubble h1 { font-size: 1.25rem; }
        .bubble h2 { font-size: 1.15rem; }
        .bubble h3 { font-size: 1.05rem; }
        .bubble h4, .bubble h5, .bubble h6 { font-size: 0.95rem; }
        .bubble p { margin: 0.4em 0; }
        .bubble ul, .bubble ol { margin: 0.3em 0 0.5em 1.5em; padding-left: 0; }
        .bubble li { margin: 0.15em 0; line-height: 1.45; }
        .bubble code {
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.82rem;
            word-break: break-word;
            color: #d9466b;
        }
        .message.self .bubble code {
            background: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.95);
        }
        .bubble pre {
            background: #f5f5f7;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 0.5em 0;
            position: relative;
            border: 1px solid var(--border-light);
        }
        .message.self .bubble pre { background: rgba(0,0,0,0.15); border-color: transparent; }
        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 0.82rem;
            display: block;
            line-height: 1.5;
            color: var(--text);
        }
        .message.self .bubble pre code { color: rgba(255,255,255,0.95); }
        .bubble blockquote {
            border-left: 3px solid var(--accent);
            margin: 0.4em 0;
            padding-left: 0.8rem;
            color: var(--text-secondary);
            background: var(--accent-light);
            border-radius: 0 6px 6px 0;
        }
        .bubble a { color: var(--accent); text-decoration: underline; font-weight: 500; }
        .bubble img { max-width: 100%; border-radius: var(--radius-sm); margin: 0.4rem 0; }
        .chat-image { max-width: 280px; max-height: 240px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: transform 0.2s ease; object-fit: cover; display: block; }
        .chat-image:hover { transform: scale(1.02); }
        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.5rem 0;
            font-size: 0.82rem;
        }
        .bubble th, .bubble td {
            border: 1px solid var(--border-light);
            padding: 6px 10px;
            text-align: left;
        }
        .bubble th { background: var(--bg); font-weight: 600; }
        .bubble hr { margin: 0.6em 0; border: none; height: 1px; background: var(--border-light); }
        .bubble strong { font-weight: 600; color: var(--text); }
        .message.self .bubble strong { color: #fff; }

        /* Copy code button */
        .copy-code-btn {
            position: absolute;
            top: 5px;
            right: 6px;
            background: var(--accent-light);
            border: 1px solid var(--accent-glow);
            color: var(--accent);
            font-size: 0.66rem;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.12s;
            z-index: 5;
        }
        .message.self .copy-code-btn { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.9); }
        .copy-code-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Input zone */
        .input-zone {
            padding: 12px 28px 20px;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--glass-medium);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .input-flex {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .input-box {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            transition: all 0.25s var(--spring);
            box-shadow: var(--shadow-sm);
        }
        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-sm);
        }
        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            padding: 11px 16px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            resize: none;
            font-family: inherit;
            line-height: 1.45;
        }
        #messageInput::placeholder { color: #aaa; }
        .btn-group { display: flex; gap: 6px; }
        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s var(--spring);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .icon-btn:hover { background: var(--accent-light); color: var(--accent); border-color: rgba(91,95,239,0.25); transform: scale(1.04); }
        #sendBtn {
            background: linear-gradient(135deg, var(--accent) 0%, #7c5ce7 100%);
            border: none;
            height: 42px;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s var(--spring);
            box-shadow: 0 2px 8px rgba(91,95,239,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:hover { background: linear-gradient(135deg, var(--accent-hover) 0%, #6d4fd9 100%); box-shadow: 0 4px 16px rgba(91,95,239,0.4); transform: translateY(-1px); }
        #sendBtn:active { transform: translateY(0); }
        #sendBtn:disabled { opacity: 0.3; cursor: default; box-shadow: none; transform: none; }
        #stopBtn {
            display: none;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: none;
            height: 42px;
            width: 42px;
            min-width: 42px;
            border-radius: 12px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
            transition: all 0.2s var(--spring);
            box-shadow: 0 2px 8px rgba(231,76,60,0.35);
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        #stopBtn.visible { display: flex; }
        #stopBtn:hover { background: linear-gradient(135deg, #c0392b 0%, #a93226 100%); box-shadow: 0 4px 16px rgba(231,76,60,0.5); transform: translateY(-1px); }
        #stopBtn:active { transform: scale(0.95); }
        .status {
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Image preview */
        .preview-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 24px 8px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 4px 12px;
            width: fit-content;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .preview-img { max-height: 36px; border-radius: 6px; }
        .remove-img { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 0 4px; }
        .remove-img:hover { color: var(--danger); }

        /* Approval modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .image-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .image-overlay-img { max-width: 92vw; max-height: 92vh; border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
        .approval-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 500px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }
        .approval-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-light);
        }
        .approval-header h3 { font-size: 1rem; color: var(--text); font-weight: 600; }
        .close-approval { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .close-approval:hover { background: var(--accent-light); }
        .approval-content {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin: 10px 0;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 0.8rem;
            color: var(--text);
            border-left: 3px solid var(--accent);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .approval-buttons { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
        .approval-btn {
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
            border: none;
            font-family: inherit;
            transition: box-shadow 0.12s;
        }
        .approve-btn { background: var(--success); color: #fff; }
        .approve-btn:hover { box-shadow: 0 2px 4px rgba(5,150,105,0.3); }
        .reject-btn { background: var(--danger); color: #fff; }
        .reject-btn:hover { box-shadow: 0 2px 4px rgba(220,38,38,0.3); }
        .edit-btn { background: #f59e0b; color: #fff; }
        .edit-btn:hover { box-shadow: 0 2px 4px rgba(245,158,11,0.3); }
        .edit-args-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px;
            color: var(--text);
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 0.75rem;
            margin-top: 10px;
            resize: vertical;
        }
        .edit-args-input:focus { outline: none; border-color: var(--accent); }
        .submit-edit {
            background: var(--accent);
            margin-top: 8px;
            width: 100%;
            padding: 7px;
            border-radius: var(--radius-sm);
            border: none;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        /* App dialog (replaces native alert/confirm) */
        .app-dialog-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 3000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        .app-dialog {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 28px 20px;
            min-width: 340px; max-width: 440px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.15);
            animation: dialogIn 0.2s ease;
        }
        @keyframes dialogIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .app-dialog-msg { margin-bottom: 22px; font-size: 0.9rem; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
        .app-dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .app-dialog-actions button {
            padding: 8px 20px; border: none; border-radius: 7px;
            font-size: 0.82rem; cursor: pointer; font-family: inherit;
            font-weight: 500; transition: opacity 0.12s;
        }
        .app-dialog-actions button:hover { opacity: 0.85; }
        .btn-dialog-primary { background: var(--accent); color: #fff; }
        .btn-dialog-secondary { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border) !important; }

        /* Suggest / Invite dropdown */
        .suggest-dropdown, .invite-dropdown {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 0;
            width: 220px;
            z-index: 300;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .invite-dropdown { left: auto; right: 20px; bottom: auto; top: 60px; }
        .suggest-item {
            padding: 8px 14px;
            cursor: pointer;
            color: var(--text);
            font-size: 0.83rem;
            transition: background 0.1s;
        }
        .suggest-item:hover { background: var(--accent-light); }

        /* Members drawer */
        .members-drawer {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 500;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0,0,0,0.06);
        }
        .members-drawer.open { transform: translateX(0); }
        .drawer-header {
            padding: 18px 16px 12px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .drawer-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drawer-close:hover { background: var(--accent-light); }
        .drawer-members {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
        }
        .member-avatar {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: #fff;
        }
        .member-name { font-size: 0.82rem; flex: 1; font-weight: 500; }
        .member-status { font-size: 0.65rem; margin-left: auto; }
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 499;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

        /* Skeleton loading */
        .skeleton-line {
            height: 14px;
            background: #e8e8ec;
            border-radius: 4px;
            margin-bottom: 8px;
            animation: shimmer 1.2s infinite;
            background: linear-gradient(90deg, #e8e8ec 25%, #f0f0f3 50%, #e8e8ec 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Rename input inline */
        .conv-rename-input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--text);
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
        }
    </style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo">AgentPro</div>
        <div class="subtitle">多智能体控制台</div>
    </div>

            </div>

            <input type="text" id="launchAgentId" placeholder="智能体 ID (例: helper)">

                <button class="btn-cancel" id="btnCancelLaunch">取消</button>

            <div class="agent-empty">暂无在线智能体</div>
        </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn" disabled>+ 新建会话</button>

    <div class="conv-list-label">会话列表</div>
    <div class="conv-list" id="convList">
        <div class="conv-empty">选择一个智能体开始</div>
    </div>

    <!-- Rooms (collapsible) -->
    <div class="rooms-section" id="roomsSection">
        <div class="section-title">群聊房间</div>
        <div id="roomsList"></div>
        <div class="room-actions">
            <div class="room-action-row">
                <input type="text" id="createRoomInput" placeholder="房间 ID...">

<script>

// ──────────────── DOM refs ────────────────

marked.setOptions({ breaks: true, gfm: true });

// ──────────────── Helpers ────────────────
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}
function isToolMessage(text) { return text && (text.startsWith('🔧') || text.startsWith('🛠️')); }

// 在 marked.parse() 之前消毒文本，剥离可能破坏页面样式的 HTML 标签
// 主要防范 browser get_content 返回的完整网页 HTML（含外部 CSS、style 等）
function sanitizeBeforeMarkdown(text) {
    if (!text) return text;
    // 剥离会加载外部资源或影响全局样式的标签
    let cleaned = text
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')   // 内联样式
        .replace(/<link[^>]*>/gi, '')                      // 外部样式表
        .replace(/<meta[^>]*>/gi, '')                      // meta 标签
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')  // 脚本
        .replace(/<iframe[^>]*>[\s\S]*?<\/iframe>/gi, ''); // 内嵌框架
    // 对于 get_content 返回的巨大 HTML 块，截断以避免渲染海量 DOM
    if (cleaned.length > 8000 && (cleaned.includes('<!DOCTYPE') || cleaned.includes('<html'))) {
        const preview = cleaned.substring(0, 2000);
        cleaned = preview + '\n\n---\n> ⚠️ 内容过长（完整 HTML 已截断），如需查看完整内容请在浏览器工具中截图查看\n';
    }
    return cleaned;
}

// ── Custom dialog (replaces alert/confirm) ──
function showDialog(msg, options = {}) {
    return new Promise((resolve) => {
        const overlay = document.getElementById('appDialogOverlay');
        const msgEl = document.getElementById('appDialogMsg');
        const actionsEl = document.getElementById('appDialogActions');
        msgEl.textContent = msg;
        actionsEl.innerHTML = '';
        const primary = options.primary || '确定';
        const secondary = options.secondary || null;
        if (secondary) {
            const b = document.createElement('button');
            b.className = 'btn-dialog-secondary';
            b.textContent = secondary;
            b.onclick = () => { overlay.style.display = 'none'; resolve(false); };
            actionsEl.appendChild(b);
        }
        const b = document.createElement('button');
        b.className = 'btn-dialog-primary';
        b.textContent = primary;
        b.onclick = () => { overlay.style.display = 'none'; resolve(true); };
        actionsEl.appendChild(b);
        overlay.style.display = 'flex';
    });
}

function generateThreadId(agentId) {
    const uuid8 = crypto.randomUUID().substring(0, 8);
    return `private_${agentId}_super_user_${uuid8}`;
}

function fmtTime(isoStr) {
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return '刚刚';
    if (diffMin < 60) return `${diffMin}分钟前`;
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return `${diffHr}小时前`;
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 7) return `${diffDay}天前`;
    return d.toLocaleDateString('zh-CN');
}

async function api(method, path, body) {
    try {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const resp = await fetch(path, opts);
        return await resp.json();
    } catch (e) { return null; }
}

// ──────────────── Theme ────────────────
function getSavedTheme() { return localStorage.getItem('agentpro-theme') || 'light'; }
function applyTheme(theme) {
    if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '🌙';
        themeToggle.title = '切换浅色';
    } else {
        document.documentElement.removeAttribute('data-theme');
        themeToggle.textContent = '☀️';
        themeToggle.title = '切换深色';
    }
    localStorage.setItem('agentpro-theme', theme);
}
function toggleTheme() {
    const current = document.documentElement.hasAttribute('data-theme') ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
}

// ──────────────── Font size ────────────────
const FONT_SIZES = { small: 0.85, medium: 1, large: 1.15 };
const FONT_LABELS = { small: 'S', medium: 'M', large: 'L' };

function getSavedFontSize() { return localStorage.getItem('agentpro-font') || 'medium'; }
function applyFontSize(size) {
    document.documentElement.style.setProperty('--font-scale', FONT_SIZES[size] || 1);
    fontSizeLabel.textContent = FONT_LABELS[size] || 'M';
    localStorage.setItem('agentpro-font', size);
}
function adjustFontSize(delta) {
    const sizes = ['small', 'medium', 'large'];
    const current = getSavedFontSize();
    const idx = Math.min(Math.max(sizes.indexOf(current) + delta, 0), sizes.length - 1);
    applyFontSize(sizes[idx]);
}

// ──────────────── Rename conversation ────────────────
async function renameConversation(threadId, newTitle) {
    if (!newTitle.trim()) return;
    await api('PATCH', `/chat/conversations/${encodeURIComponent(threadId)}`, { title: newTitle.trim() });
    const conv = findConversation(threadId);
    if (conv) conv.title = newTitle.trim();
    // Update header if this is the active conversation
    if (activeThreadId === threadId) {
        currentChatNameSpan.textContent = newTitle.trim();
    }
    renderConvList();
}

function startRenameConvItem(threadId, titleEl) {
    const oldTitle = findConversation(threadId)?.title || '';
    const input = document.createElement('input');
    input.className = 'conv-rename-input';
    input.value = oldTitle;
    input.style.cssText = titleEl.style.cssText;
    titleEl.replaceWith(input);
    input.focus();
    input.select();
    const commit = async () => {
        const newTitle = input.value.trim() || oldTitle;
        const span = document.createElement('span');
        span.className = 'conv-title';
        span.textContent = newTitle;
        input.replaceWith(span);
        if (newTitle !== oldTitle) await renameConversation(threadId, newTitle);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { input.value = oldTitle; commit(); } });
}

function startRenameHeader() {
    if (!activeThreadId || activeRoom) return;
    const h2 = currentChatNameSpan;
    const oldTitle = h2.textContent;
    const input = document.createElement('input');
    input.className = 'title-edit-input';
    input.value = oldTitle;
    h2.replaceWith(input);
    input.focus();
    input.select();
    const commit = async () => {
        const newTitle = input.value.trim() || oldTitle;
        const newH2 = document.createElement('h2');
        newH2.id = 'currentChatName';
        newH2.title = '点击重命名';
        newH2.textContent = newTitle;
        newH2.addEventListener('click', startRenameHeader);
        input.replaceWith(newH2);
        currentChatNameSpan = newH2;
        if (newTitle !== oldTitle) await renameConversation(activeThreadId, newTitle);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { input.value = oldTitle; commit(); } });
}

// ──────────────── Conversation management ────────────────
async function loadConversations(agentId) {
    const data = await api('GET', `/chat/conversations?agent_id=${encodeURIComponent(agentId)}`);
    if (data && data.conversations) {
        conversations[agentId] = data.conversations;
    } else {
        conversations[agentId] = [];
    }
}

function findConversation(threadId) {
    for (const agentId in conversations) {
        const found = conversations[agentId].find(c => c.thread_id === threadId);
        if (found) return found;
    }
    return null;
}

function renderConvList() {
    convList.innerHTML = '';
    if (!activeAgent) {
        convList.innerHTML = '<div class="conv-empty">选择一个智能体开始</div>';
        return;
    }
    const convs = conversations[activeAgent] || [];
    if (convs.length === 0) {
        convList.innerHTML = '<div class="conv-empty">暂无会话</div>';
        return;
    }
    convs.forEach(c => {
        const item = document.createElement('div');
        item.className = `conv-item${c.thread_id === activeThreadId && !activeRoom ? ' active' : ''}`;
        item.innerHTML = `
            <span class="conv-title">${escapeHtml(c.title || '新会话')}</span>
            <span class="conv-time">${fmtTime(c.updated_at || c.created_at)}</span>
            <button class="conv-edit" data-thread="${escapeHtml(c.thread_id)}" title="重命名">✏️</button>
            <button class="conv-delete" data-thread="${escapeHtml(c.thread_id)}" title="归档">&times;</button>
        `;
        item.onclick = (e) => {
            if (e.target.classList.contains('conv-delete') || e.target.classList.contains('conv-edit')) return;
            switchConversation(activeAgent, c.thread_id);
        };
        item.addEventListener('dblclick', (e) => {
            if (e.target.classList.contains('conv-delete') || e.target.classList.contains('conv-edit')) return;
            const titleEl = item.querySelector('.conv-title');
            if (titleEl) startRenameConvItem(c.thread_id, titleEl);
        });
        convList.appendChild(item);
    });

    // Wire delete buttons
    convList.querySelectorAll('.conv-delete').forEach(btn => {
        btn.onclick = async (e) => {
            e.stopPropagation();
            const tid = btn.dataset.thread;
            if (await showDialog('确认归档此会话？', {primary: '归档', secondary: '取消'})) {
                await archiveConversation(tid);
            }
        };
    });

    // Wire edit buttons
    convList.querySelectorAll('.conv-edit').forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            const tid = btn.dataset.thread;
            const item = btn.closest('.conv-item');
            const titleEl = item.querySelector('.conv-title');
            if (titleEl) startRenameConvItem(tid, titleEl);
        };
    });
}

async function switchConversation(agentId, threadId) {
    activeAgent = agentId;
    activeThreadId = threadId;
    activeRoom = null;

    // Update header
    const conv = findConversation(threadId);
    currentChatNameSpan.innerText = conv ? conv.title : agentId;
    currentChatMetaSpan.innerText = '对话中';

    // Load messages if not cached
    if (!messageCache[threadId]) {
        messageCache[threadId] = [];
        messagesDiv.innerHTML = '<div class="empty-chat">加载中...</div>';
        const history = await api('GET', `/chat/history?thread_id=${encodeURIComponent(threadId)}&limit=200`);
        if (history && Array.isArray(history)) {
            messageCache[threadId] = history.map(h => ({ role: h.role, content: h.content, created_at: h.created_at, image: h.image }));
        }
    }

    renderMessages(threadId);
    renderConvList();
    renderAgentList();
    messageInput.disabled = false;
    sendBtn.disabled = false;
    newChatBtn.disabled = false;
    inviteAgentBtn.style.display = 'none';
    membersToggleBtn.style.display = 'none';
    hideMembersDrawer();
    messageInput.focus();
}

async function createConversation(agentId) {
    const threadId = generateThreadId(agentId);
    await api('POST', '/chat/conversations', { agent_id: agentId, thread_id: threadId });

    // Add to local state
    if (!conversations[agentId]) conversations[agentId] = [];
    conversations[agentId].unshift({
        thread_id: threadId,
        agent_id: agentId,
        title: '新会话',
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString(),
        is_archived: false
    });

    messageCache[threadId] = [];
    await switchConversation(agentId, threadId);
}

async function archiveConversation(threadId) {
    await api('PATCH', `/chat/conversations/${encodeURIComponent(threadId)}`, { is_archived: true });
    // Remove from local state
    for (const agentId in conversations) {
        conversations[agentId] = conversations[agentId].filter(c => c.thread_id !== threadId);
        if (conversations[agentId].length === 0) delete conversations[agentId];
    }
    delete messageCache[threadId];

    if (activeThreadId === threadId) {
        activeThreadId = null;
        messagesDiv.innerHTML = '<div class="empty-chat">开始新会话</div>';
        currentChatNameSpan.innerText = activeAgent || 'AgentPro';
        currentChatMetaSpan.innerText = '就绪';
    }
    renderConvList();
}

async function setConversationTitle(threadId, firstMessage) {
    const title = firstMessage.trim().substring(0, 80);
    await api('PATCH', `/chat/conversations/${encodeURIComponent(threadId)}`, { title: title });
    const conv = findConversation(threadId);
    if (conv) conv.title = title;
    renderConvList();
}

// ──────────────── Messages ────────────────
function renderMessages(threadId) {
    messagesDiv.innerHTML = '';
    const msgs = messageCache[threadId] || [];
    if (msgs.length === 0) {
        messagesDiv.innerHTML = '<div class="empty-chat">开始新会话</div>';
        return;
    }
    msgs.forEach(m => {
        if (!showToolCalls && isToolMessage(m.content)) return;
        const sender = m.role === 'user' ? '我' : (activeAgent || '智能体');
        const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });
        displayMessage(sender, m.content, time, m.image);
    });
    addCopyButtonsToCodeBlocks();
    hideScrollHint();
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function isScrolledToBottom() {
    if (!messagesDiv) return true;
    return messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 60;
}

function scrollToLatest() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    hideScrollHint();
}

let _newMsgCount = 0;
function showScrollHint() {
    _newMsgCount++;
    const hint = document.getElementById('scrollHint');
    if (!hint) return;
    hint.style.display = '';
    hint.querySelector('.scroll-bottom-hint-inner').textContent =
        _newMsgCount > 1 ? `↓ ${_newMsgCount} 条新消息` : '↓ 回到底部';
}
function hideScrollHint() {
    _newMsgCount = 0;
    const hint = document.getElementById('scrollHint');
    if (hint) hint.style.display = 'none';
}

function displayMessage(sender, text, time, image = null) {
    const isSelf = (sender === '我');
    const wasAtBottom = isScrolledToBottom();
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${isSelf ? 'self' : ''}`;
    const rendered = marked.parse(sanitizeBeforeMarkdown(text));
    const imageHtml = image ? `<img src="${escapeHtml(image)}" class="chat-image" onclick="viewFullImage(this.src)" loading="lazy">` : '';
    msgDiv.innerHTML = `<div class="message-meta">${escapeHtml(sender)} &middot; ${escapeHtml(time)}</div><div class="bubble">${imageHtml}${rendered}</div>`;
    messagesDiv.appendChild(msgDiv);
    addCopyButtonsToCodeBlocks();
    if (wasAtBottom) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else {
        showScrollHint();
    }
}

// 用户手动滚到底部时自动隐藏提示
messagesDiv.addEventListener('scroll', function() {
    if (isScrolledToBottom()) hideScrollHint();
});

function viewFullImage(src) {
    const overlay = document.createElement('div');
    overlay.className = 'image-overlay';
    overlay.innerHTML = `<img src="${src}" class="image-overlay-img">`;
    overlay.onclick = () => overlay.remove();
    document.body.appendChild(overlay);
}

async function saveMessage(threadId, role, content, image = null) {
    await api('POST', '/chat/history', { thread_id: threadId, role, content, image });
}

// ──────────────── Agent selector ────────────────
function renderAgentList() {
    if (!agentList) return;
    if (agents.length === 0) {
        agentList.innerHTML = '<div class="agent-empty">暂无智能体</div>';
        agentCount.textContent = '0';
        return;
    }
    agentCount.textContent = onlineAgentsSet.size;
    agentList.innerHTML = '';
    const sorted = [...agents].sort();
    sorted.forEach(a => {
        const isOnline = onlineAgentsSet.has(a);
        const isActive = a === activeAgent && !activeRoom;
        const item = document.createElement('div');
        const hasUnread = unreadAgents.has(a);
        item.className = `agent-item${isActive ? ' active' : ''}${hasUnread ? ' has-unread' : ''}`;
        item.dataset.agent = a;
        item.innerHTML = `
            <span class="agent-dot ${isOnline ? 'online' : 'offline'}"></span>
            <span class="agent-icon">🤖</span>
            <span class="agent-name">${escapeHtml(a)}</span>
            <span class="agent-unread"></span>
            ${isOnline ? `<button class="agent-close-btn" title="关闭智能体">×</button>` : ''}
        `;
        item.title = `${a} (${isOnline ? '在线' : '离线'})`;
        item.onclick = () => {
            if (activeRoom) { activeRoom = null; updateRoomsUI(); hideMembersDrawer(); }
            selectAgent(a);
        };
        // 关闭按钮：阻止冒泡到 agent-item 的 onclick
        if (isOnline) {
            const closeBtn = item.querySelector('.agent-close-btn');
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                stopAgentProcess(a);
            };
        }
        agentList.appendChild(item);
    });
}

async function selectAgent(agentId) {

    if (!conversations[agentId]) {

// ──────────────── Send message ────────────────
async function sendMessage() {
    let text = messageInput.value.trim();
    if (!text && !currentImageBase64) return;

    // Upload image first (convert base64 → file path on server)
    let imageUrl = null;
    if (currentImageBase64) {
        imageUrl = await uploadImage(currentImageBase64);
    }

    // If no active thread and we have an agent, auto-create a conversation
    if (!activeThreadId && activeAgent) {
        await createConversation(activeAgent);
        if (!text && !imageUrl) {
            messageInput.value = '';
            messageInput.focus();
            return;
        }
    }

    // Handle /new: create a fresh conversation
    if (text.startsWith('/new')) {
        text = text.substring(4).trim();
        if (activeAgent) {
            await createConversation(activeAgent);
            if (!text && !imageUrl) {
                messageInput.value = '';
                messageInput.focus();
                return;
            }
        }
    }

    const threadId = activeThreadId;
    const time = new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });

    if (activeAgent && threadId) {
        // Remove empty-chat placeholder before displaying message
        const emptyDiv = messagesDiv.querySelector('.empty-chat');
        if (emptyDiv) emptyDiv.remove();

        // Determine if this is the first message in a new conversation
        const isFirstMsg = !messageCache[threadId] || messageCache[threadId].length === 0;

        // Save to backend (image path, not base64)
        saveMessage(threadId, 'user', text || '', imageUrl);
        // Cache locally
        if (!messageCache[threadId]) messageCache[threadId] = [];
        messageCache[threadId].push({ role: 'user', content: text, created_at: new Date().toISOString(), image: imageUrl });
        displayMessage('我', text, time, imageUrl);

        // Auto-title: if this is the first user message
        const userMsgs = messageCache[threadId].filter(m => m.role === 'user');
        if (userMsgs.length === 1 && text) {
            setConversationTitle(threadId, text);
        }

        ws.send(JSON.stringify({ type: 'send', to: activeAgent, text: text || '', image: imageUrl, thread_id: threadId, new_thread: isFirstMsg }));
    } else if (activeRoom) {
        // Remove empty-chat placeholder before displaying message
        const emptyDiv = messagesDiv.querySelector('.empty-chat');
        if (emptyDiv) emptyDiv.remove();

        if (!roomMessages[activeRoom]) roomMessages[activeRoom] = [];
        roomMessages[activeRoom].push({ sender: '我', text, time, image: imageUrl });
        displayMessage('我', text, time, imageUrl);
        ws.send(JSON.stringify({ type: 'group_message', room_id: activeRoom, text, image: imageUrl }));
    }

    messageInput.value = '';
    currentImageBase64 = null;
    previewDiv.style.display = 'none';
    imageInput.value = '';
    messageInput.style.height = 'auto';
    messageInput.focus();
}

// ──────────────── Suggest dropdown ────────────────
let suggestDropdown = null;
function closeSuggest() { if (suggestDropdown) { suggestDropdown.remove(); suggestDropdown = null; } }
function showSuggest(items, onSelect) {
    closeSuggest();
    const rect = messageInput.getBoundingClientRect();
    const div = document.createElement('div');
    div.className = 'suggest-dropdown';
    items.forEach(item => {
        const opt = document.createElement('div');
        opt.className = 'suggest-item';
        opt.innerText = item;
        opt.onclick = () => { onSelect(item); closeSuggest(); messageInput.focus(); };
        div.appendChild(opt);
    });
    document.body.appendChild(div);
    div.style.bottom = `${window.innerHeight - rect.top + 8}px`;
    div.style.left = `${rect.left}px`;
    suggestDropdown = div;
    setTimeout(() => {
        const handleClick = (e) => { if (!div.contains(e.target) && e.target !== messageInput) closeSuggest(); document.removeEventListener('click', handleClick); };
        document.addEventListener('click', handleClick);
    }, 0);
}

messageInput.addEventListener('input', function (e) {
    const val = this.value;
    const cursorPos = this.selectionStart;
    const beforeCursor = val.slice(0, cursorPos);
    const lastAtIndex = beforeCursor.lastIndexOf('@');
    const lastSlash = beforeCursor.lastIndexOf('/');
    if (lastAtIndex !== -1 && lastAtIndex === beforeCursor.length - 1) {
        const availableAgents = agents.filter(a => a !== 'super_user');
        showSuggest(availableAgents, (selected) => {
            const newVal = val.slice(0, lastAtIndex) + '@' + selected + ' ' + val.slice(cursorPos);
            messageInput.value = newVal;
            messageInput.selectionStart = messageInput.selectionEnd = lastAtIndex + selected.length + 2;
            messageInput.dispatchEvent(new Event('input'));
        });
    } else if (lastSlash !== -1 && lastSlash === beforeCursor.length - 1 && val[lastSlash] === '/') {
        showSuggest(['/new '], (cmd) => {
            const newVal = val.slice(0, lastSlash) + cmd + ' ';
            messageInput.value = newVal;
            messageInput.selectionStart = messageInput.selectionEnd = newVal.length;
        });
    } else { closeSuggest(); }
});
messageInput.addEventListener('blur', () => setTimeout(closeSuggest, 200));

// ──────────────── WebSocket ────────────────
function connect() {
    ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.onopen = () => {
        connStatusSpan.innerText = '已连接';
        connStatusSpan.style.color = 'var(--success)';
        ws.send(JSON.stringify({ type: 'list_rooms' }));
        updateMembersPanel(rooms[activeRoom]?.members || []);
    };
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'agents') {
            agents = (data.agents || []).filter(a => a !== 'super_user');
            onlineAgentsSet.clear();
            agents.forEach(a => onlineAgentsSet.add(a));
            renderAgentList();
            if (activeRoom && rooms[activeRoom]) updateMembersPanel(rooms[activeRoom].members);
        } else if (data.type === 'agent_online') {
            const aid = data.agent_id;
            if (aid && aid !== 'super_user') {
                onlineAgentsSet.add(aid);
                if (!agents.includes(aid)) agents.push(aid);
                renderAgentList();
                if (activeRoom && rooms[activeRoom]) updateMembersPanel(rooms[activeRoom].members);
            }
        } else if (data.type === 'agent_offline') {
            const aid = data.agent_id;
            if (aid) {
                onlineAgentsSet.delete(aid);
                renderAgentList();
                if (activeRoom && rooms[activeRoom]) updateMembersPanel(rooms[activeRoom].members);
            }
        } else if (data.type === 'message') {
            const from = data.from, text = data.text, image = data.image || null;
            const time = new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });
            // Determine which thread to save to
            let targetThreadId = activeThreadId;
            if (activeAgent !== from) {
                // Message from an agent not currently active — find or create a thread
                const convs = conversations[from] || [];
                targetThreadId = convs.length > 0 ? convs[0].thread_id : null;
                if (!targetThreadId) {
                    // Auto-create a conversation for messages from previously unknown agents
                    targetThreadId = generateThreadId(from);
                    await api('POST', '/chat/conversations', { agent_id: from, thread_id: targetThreadId });
                    if (!conversations[from]) conversations[from] = [];
                    conversations[from].unshift({
                        thread_id: targetThreadId, agent_id: from, title: '新会话',
                        created_at: new Date().toISOString(), updated_at: new Date().toISOString(), is_archived: false
                    });
                    messageCache[targetThreadId] = [];
                }
                // Mark agent as having unread messages
                unreadAgents.add(from);
                renderAgentList();
            }
            if (targetThreadId) {
                saveMessage(targetThreadId, 'assistant', text, image);
                if (!messageCache[targetThreadId]) messageCache[targetThreadId] = [];
                messageCache[targetThreadId].push({ role: 'assistant', content: text, created_at: new Date().toISOString(), image: image });
            }
            // Display if this agent is active
            if (activeAgent === from && activeThreadId && (showToolCalls || !isToolMessage(text))) {
                displayMessage(from, text, time, image);
            }
        } else if (data.type === 'group_message') {
            const rid = data.room_id;
            const from = data.from;
            let text = data.text || (data.payload?.text);
            const image = data.image || null;
            if (!text && !image) return;
            const time = new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai' });
            if (!roomMessages[rid]) roomMessages[rid] = [];
            roomMessages[rid].push({ sender: from, text, time, image: image });
            if (activeRoom === rid && (showToolCalls || !isToolMessage(text))) displayMessage(from, text, time, image);
            else if (rooms[rid]) rooms[rid].unread = true;
            renderRooms();
        } else if (data.type === 'room_members_update' || data.type === 'room_members') {
            const rid = data.room_id;
            const members = data.members;
            if (!rooms[rid]) rooms[rid] = { members: [], unread: false };
            rooms[rid].members = members;
            if (activeRoom === rid) updateMembersPanel(members);
            renderRooms();
        } else if (data.type === 'rooms_list') {
            (data.rooms || []).forEach(rid => { if (!rooms[rid]) rooms[rid] = { members: [], unread: false }; });
            renderRooms();
        } else if (data.type === 'room_created' || data.type === 'room_joined') {
            if (!rooms[data.room_id]) rooms[data.room_id] = { members: [], unread: false };
            renderRooms();
            if (activeRoom === data.room_id) ws.send(JSON.stringify({ type: 'get_room_members', room_id: data.room_id }));
        } else if (data.type === 'approval_request') {
            pendingApproval = { tool: data.tool, args: data.args, allowed: data.allowed, fromAgent: data.from, tool_call_id: data.tool_call_id };
            approvalContentDiv.innerHTML = `<strong>工具调用审批</strong><br>工具: ${escapeHtml(data.tool)}<br>参数: <pre style="margin-top:6px;">${JSON.stringify(data.args, null, 2)}</pre><br>允许: ${data.allowed.join(', ')}`;
            modalOverlay.classList.add('active');
        } else if (data.type === 'agent_status') {
            const aid = data.agent_id;
            const status = data.status;
            agentBusyStates[aid] = status;
            updateStopButton();
        }
    };
    ws.onclose = () => {
        connStatusSpan.innerText = '已断开 — 重连中...';
        connStatusSpan.style.color = 'var(--danger)';
        setTimeout(connect, 3000);
        if (activeRoom) updateMembersPanel(rooms[activeRoom]?.members || []);
    };
}

// Copy code buttons
function addCopyButtonsToCodeBlocks() {
    document.querySelectorAll('.message .bubble pre').forEach(pre => {
        if (pre.querySelector('.copy-code-btn')) return;
        const codeElem = pre.querySelector('code');
        if (!codeElem) return;
        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.innerText = '复制';
        btn.onclick = async (e) => {
            e.stopPropagation();
            try {
                await navigator.clipboard.writeText(codeElem.innerText);
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = '复制'; }, 1500);
            } catch (err) {
                btn.innerText = '失败';
                setTimeout(() => { btn.innerText = '复制'; }, 1500);
            }
        };
        if (getComputedStyle(pre).position === 'static') pre.style.position = 'relative';
        pre.appendChild(btn);
    });
}

// ──────────────── Startup ────────────────
// Load all conversations on connect
async function loadAllConversations() {
    const data = await api('GET', '/chat/conversations');
    if (data && data.conversations) {
        conversations = {};
        data.conversations.forEach(c => {
            if (!conversations[c.agent_id]) conversations[c.agent_id] = [];
            conversations[c.agent_id].push(c);
        });
    }
}

connect();
// Try to load existing conversations immediately (server might not be up yet, but /chat/conversations will just fail gracefully)
setTimeout(loadAllConversations, 500);
</script>
