<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentPro · 智能体空间</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 10% 30%, #0F172A, #020617);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 1300px;
            max-width: 95vw;
            height: 88vh;
            background: rgba(17, 24, 39, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, #E2E8F0, #A5B4FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .sidebar-header p {
            font-size: 0.7rem;
            color: #6B7280;
            margin-top: 6px;
        }

        .agents-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .agent-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .agent-card:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(4px);
        }

        .agent-card.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .agent-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #3B82F6, #8B5CF6);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .agent-info {
            flex: 1;
        }

        .agent-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: #F1F5F9;
        }

        .agent-status {
            font-size: 0.65rem;
            color: #10B981;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.15);
        }

        .chat-header {
            padding: 20px 28px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .chat-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #E2E8F0;
        }

        .chat-header span {
            font-size: 0.7rem;
            color: #6B7280;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }
        .messages::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeUp 0.2s ease;
        }

        .message.self {
            align-self: flex-end;
        }

        .message-meta {
            font-size: 0.65rem;
            font-weight: 500;
            margin-bottom: 4px;
            margin-left: 12px;
            color: #94A3B8;
        }

        .message.self .message-meta {
            text-align: right;
            margin-right: 12px;
        }

        .bubble {
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            line-height: 1.5;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            color: #E2E8F0;
        }

        .message.self .bubble {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            border: none;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bubble p { margin-bottom: 6px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble code {
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .bubble pre {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 16px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble ul, .bubble ol {
            padding-left: 1.5rem;
            margin: 6px 0;
        }
        .bubble a {
            color: #A5B4FC;
            text-decoration: none;
            border-bottom: 1px dotted;
        }

        .input-zone {
            padding: 16px 28px 24px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-flex {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            background: rgba(0,0,0,0.35);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .input-box:focus-within {
            border-color: #6366F1;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
        }

        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: #F1F5F9;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: #CBD5E1;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(99,102,241,0.4);
            color: white;
        }

        #sendBtn {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        #sendBtn:hover {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .preview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 6px 16px;
            width: fit-content;
        }
        .preview-img {
            max-height: 48px;
            border-radius: 12px;
        }
        .remove-img {
            background: none;
            border: none;
            color: #F87171;
            cursor: pointer;
        }
        .status {
            text-align: center;
            font-size: 0.65rem;
            color: #6B7280;
            margin-top: 10px;
        }
        .message-meta {
            font-size: 0.65rem;
            font-weight: 500;
            margin-bottom: 4px;
            margin-left: 12px;
            color: #94A3B8;
            display: flex;
            gap: 8px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AgentPro</h1>
            <p>intelligent swarm</p>
        </div>
        <div class="agents-list" id="agentsList"></div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <h2 id="currentAgentName">未连接</h2>
            <span id="currentAgentStatus">就绪</span>
        </div>
        <div class="messages" id="messages"></div>
        <div id="imagePreview" class="preview-bar" style="display: none;">
            <img id="previewImg" class="preview-img">
            <button id="removeImageBtn" class="remove-img">✖ 移除</button>
        </div>
        <div class="input-zone">
            <div class="input-flex">
                <div class="input-box">
                    <textarea id="messageInput" rows="1" placeholder="输入消息... /new 开启新话题" disabled></textarea>
                </div>
                <div class="btn-group">
                    <button id="imageBtn" class="icon-btn" title="发送图片">🖼️</button>
                    <button id="sendBtn" disabled>发送</button>
                </div>
            </div>
            <div class="status" id="connectionStatus">⚡ 初始化</div>
        </div>
    </div>
</div>
<input type="file" id="imageInput" accept="image/*" style="display: none;">

<script>
    let ws = null;
    let currentAgent = null;
    let agents = [];
    let messageHistory = {};
    let currentImageBase64 = null;

    const agentsContainer = document.getElementById('agentsList');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentAgentNameSpan = document.getElementById('currentAgentName');
    const currentAgentStatusSpan = document.getElementById('currentAgentStatus');
    const connStatusSpan = document.getElementById('connectionStatus');
    const previewDiv = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImgBtn = document.getElementById('removeImageBtn');
    const imageInput = document.getElementById('imageInput');
    const imageBtn = document.getElementById('imageBtn');

    marked.setOptions({ breaks: true, gfm: true });

    function connect() {
        ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.onopen = () => {
            connStatusSpan.innerText = '● 已连接';
            connStatusSpan.style.color = '#10B981';
        };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'agents') {
                agents = (data.agents || []).filter(a => a !== 'super_user');
                renderAgents();
                if (!currentAgent && agents.length) selectAgent(agents[0]);
            } else if (data.type === 'message') {
                const from = data.from;
                const text = data.text;
                const time = new Date().toLocaleTimeString();   // 接收时间
                if (!messageHistory[from]) messageHistory[from] = [];
                messageHistory[from].push({ sender: from, text, time });
                if (from === currentAgent) {
                    displayMessage(from, text, time);
                } else {
                    markUnread(from);
                    document.title = '📩 新消息';
                    setTimeout(() => { document.title = 'AgentPro · 智能体空间'; }, 3000);
                }
            }
        };
        ws.onclose = () => {
            connStatusSpan.innerText = '● 断开重连';
            connStatusSpan.style.color = '#F87171';
            setTimeout(connect, 3000);
        };
    }

    function renderAgents() {
        agentsContainer.innerHTML = '';
        agents.forEach(agent => {
            const card = document.createElement('div');
            card.className = 'agent-card';
            if (currentAgent === agent) card.classList.add('active');
            card.innerHTML = `
                <div class="agent-avatar">🤖</div>
                <div class="agent-info">
                    <div class="agent-name">${escapeHtml(agent)}</div>
                    <div class="agent-status">在线</div>
                </div>
            `;
            card.onclick = () => selectAgent(agent);
            agentsContainer.appendChild(card);
        });
    }

    function selectAgent(agent) {
        currentAgent = agent;
        currentAgentNameSpan.innerText = agent;
        currentAgentStatusSpan.innerText = '对话中';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        renderAgents();
        loadMessages(agent);
        clearUnread(agent);
        messageInput.focus();
    }

    function loadMessages(agent) {
        messagesDiv.innerHTML = '';
        const msgs = messageHistory[agent] || [];
        msgs.forEach(msg => displayMessage(msg.sender, msg.text, msg.time));
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function displayMessage(sender, text, time) {
        const isSelf = (sender === '我');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSelf ? 'self' : ''}`;
        const rendered = marked.parse(text);
        const timeStr = time ? time : new Date().toLocaleTimeString();
        const senderName = isSelf ? '我' : sender;
        msgDiv.innerHTML = `
            <div class="message-meta">${escapeHtml(senderName)} · ${escapeHtml(timeStr)}</div>
            <div class="bubble">${rendered}</div>
        `;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function markUnread(agent) {
        const cards = document.querySelectorAll('.agent-card');
        for (let card of cards) {
            const nameDiv = card.querySelector('.agent-name');
            if (nameDiv && nameDiv.innerText === agent && !card.querySelector('.unread-dot')) {
                const dot = document.createElement('span');
                dot.className = 'unread-dot';
                dot.innerText = ' ●';
                dot.style.color = '#F97316';
                dot.style.fontSize = '12px';
                nameDiv.appendChild(dot);
                break;
            }
        }
    }

    function clearUnread(agent) {
        const cards = document.querySelectorAll('.agent-card');
        for (let card of cards) {
            const nameDiv = card.querySelector('.agent-name');
            if (nameDiv && nameDiv.innerText === agent) {
                const dot = nameDiv.querySelector('.unread-dot');
                if (dot) dot.remove();
                break;
            }
        }
    }

    function sendMessage() {
        let text = messageInput.value.trim();
        if (!text && !currentImageBase64) return;
        let newThread = false;
        if (text.startsWith('/new')) {
            newThread = true;
            text = text.substring(4).trim() || "新对话";
        }
        if (text) {
            if (!messageHistory[currentAgent]) messageHistory[currentAgent] = [];
            messageHistory[currentAgent].push({ sender: '我', text, time: new Date().toLocaleTimeString() });
            displayMessage('我', text);
        }
        ws.send(JSON.stringify({
            type: 'send',
            to: currentAgent,
            text: text,
            image: currentImageBase64 || null,
            new_thread: newThread
        }));
        messageInput.value = '';
        currentImageBase64 = null;
        previewDiv.style.display = 'none';
        imageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            currentImageBase64 = ev.target.result.split(',')[1];
            previewImg.src = ev.target.result;
            previewDiv.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    });
    removeImgBtn.addEventListener('click', () => {
        currentImageBase64 = null;
        previewDiv.style.display = 'none';
        imageInput.value = '';
    });

    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    sendBtn.addEventListener('click', sendMessage);

    connect();
</script>
</body>
</html>
