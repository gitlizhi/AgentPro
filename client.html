<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentPro · 智能体空间</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600&display=swap');

        :root {
            --neon-purple: #8B5CF6;
            --neon-cyan: #06B6D4;
            --neon-pink: #EC4899;
            --dark-bg: #0A0E27;
            --card-bg: rgba(15, 23, 42, 0.8);
            --text-primary: #E0E7FF;
            --text-secondary: #A5B4FC;
            --border-glow: rgba(139, 92, 246, 0.3);
            --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--dark-bg);
            background:
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%),
                var(--dark-bg);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: float 6s infinite linear;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        .agent-container {
            width: 1400px;
            max-width: 95vw;
            height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-glow), 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .sidebar {
            width: 320px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9), rgba(15,23,42,0.8));
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(139,92,246,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 32px 24px 20px;
            border-bottom: 1px solid rgba(139,92,246,0.1);
        }

        .sidebar-header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan), var(--neon-pink));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .sidebar-header h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
            border-radius: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            padding: 16px 24px 8px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .agents-list, .rooms-list {
            padding: 0 12px 16px;
        }

        .agent-card, .room-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.1));
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .agent-card:hover, .room-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
            border-color: var(--neon-purple);
        }

        .agent-card.active, .room-card.active {
            background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(6,182,212,0.3));
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }

        .agent-avatar, .room-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, var(--neon-purple), var(--neon-cyan));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .agent-info, .room-info {
            flex: 1;
        }

        .agent-name, .room-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .agent-status, .room-members {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-pink);
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }

        .room-actions {
            padding: 16px;
            border-top: 1px solid rgba(139,92,246,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .room-action-item {
            display: flex;
            gap: 8px;
        }
        .room-action-item input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
        }
        .room-action-item button {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(10,14,39,0.6), rgba(15,23,42,0.8));
            position: relative;
        }

        .chat-header {
            padding: 20px 28px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9), transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139,92,246,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-left {
            flex: 1;
        }
        .chat-header-left h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
        }
        .chat-header-left span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin-top: 4px;
        }

        .members-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 12px 20px;
            min-width: 160px;
            text-align: right;
        }
        .members-panel .label {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .members-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }
        .member-badge {
            background: rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.75rem;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .invite-section {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
        }
        .invite-section select {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 4px 8px;
            color: var(--text-primary);
            font-size: 0.7rem;
        }
        .invite-section button {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(139,92,246,0.2);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-glow);
            margin-left: 20px;
        }
        .toggle-switch span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: #2d3748;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
        }
        input:checked + .slider:before { transform: translateX(26px); }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: rgba(139,92,246,0.1); border-radius: 3px; }
        .messages::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan)); border-radius: 3px; }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messageSlide 0.4s ease-out;
        }
        .message.self { align-self: flex-end; }
        .message-meta {
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 4px;
            margin-left: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
        }
        .message.self .message-meta { text-align: right; margin-right: 12px; }
        .bubble {
            padding: 12px 20px;
            border-radius: 20px;
            background: rgba(30,41,59,0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.self .bubble {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            border-bottom-right-radius: 6px;
        }
        .bubble p { margin-bottom: 6px; }
        .bubble code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 6px; font-family: monospace; }
        .bubble pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 16px; overflow-x: auto; }

        .input-zone {
            padding: 20px 28px 28px;
            background: linear-gradient(180deg, rgba(10,14,39,0.9), transparent);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(139,92,246,0.2);
        }
        .input-flex {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-box {
            flex: 1;
            background: rgba(0,0,0,0.35);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .input-box:focus-within {
            border-color: var(--neon-purple);
            box-shadow: 0 0 0 2px rgba(139,92,246,0.3);
        }
        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            padding: 14px 22px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            resize: none;
            font-family: inherit;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(99,102,241,0.4); color: white; }
        #sendBtn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .preview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 28px 0;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 6px 16px;
            width: fit-content;
        }
        .preview-img { max-height: 48px; border-radius: 12px; }
        .remove-img { background: none; border: none; color: var(--neon-pink); cursor: pointer; }
        .status { text-align: center; font-size: 0.7rem; color: var(--text-secondary); margin-top: 12px; }

        .approval-panel {
            position: fixed;
            bottom: 120px;
            right: 32px;
            background: linear-gradient(135deg, rgba(10,14,39,0.95), rgba(15,23,42,0.9));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px -12px black, 0 0 40px var(--neon-purple);
            z-index: 1000;
            max-width: 360px;
            border: 1px solid var(--border-glow);
        }
        .approval-btn {
            padding: 6px 14px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 6px;
            border: none;
        }
        .approval-btn.approve { background: #10b981; color: white; }
        .approval-btn.reject { background: #ef4444; color: white; }
        .approval-btn.edit { background: #f59e0b; color: white; }
    </style>
</head>
<body>
<div class="grid-background"></div>
<div class="particles" id="particles"></div>

<div class="agent-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AgentPro</h1>
            <p>intelligent swarm</p>
        </div>
        <div class="section-title">🤖 智能体伙伴</div>
        <div class="agents-list" id="agentsList"></div>
        <div class="section-title">🏠 群聊房间</div>
        <div class="rooms-list" id="roomsList"></div>
        <div class="room-actions">
            <div class="room-action-item">
                <input type="text" id="createRoomInput" placeholder="房间ID">
                <button id="createRoomBtn">创建</button>
            </div>
            <div class="room-action-item">
                <input type="text" id="joinRoomInput" placeholder="房间ID">
                <button id="joinRoomBtn">加入</button>
            </div>
        </div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <h2 id="currentChatName">未选择</h2>
                <span id="currentChatMeta">就绪</span>
            </div>
            <div class="members-panel" id="membersPanel" style="display: none;">
                <div class="label">群成员</div>
                <div class="members-list" id="membersList"></div>
                <div class="invite-section">
                    <select id="inviteSelect"></select>
                    <button id="inviteBtn">邀请</button>
                </div>
            </div>
            <div class="toggle-switch">
                <span>工具调用</span>
                <label class="switch">
                    <input type="checkbox" id="toggleToolCalls" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <div id="imagePreview" class="preview-bar" style="display: none;">
            <img id="previewImg" class="preview-img">
            <button id="removeImageBtn" class="remove-img">✖</button>
        </div>
        <div class="input-zone">
            <div class="input-flex">
                <div class="input-box">
                    <textarea id="messageInput" rows="1" placeholder="输入消息... /new 新话题" disabled></textarea>
                </div>
                <div class="btn-group">
                    <button id="imageBtn" class="icon-btn" title="发送图片">📷</button>
                    <button id="sendBtn" disabled>发送</button>
                </div>
            </div>
            <div class="status" id="connectionStatus">⚡ 初始化</div>
        </div>
    </div>
</div>

<input type="file" id="imageInput" accept="image/*" style="display: none;">

<div id="approvalPanel" class="approval-panel" style="display: none;">
    <div id="approvalContent"></div>
    <div style="margin-top: 12px; display: flex; gap: 8px;">
        <button id="approveBtn" class="approval-btn approve">✅ 批准</button>
        <button id="rejectBtn" class="approval-btn reject">❌ 拒绝</button>
        <button id="editBtn" class="approval-btn edit">✏️ 修改</button>
    </div>
    <input type="text" id="editArgsInput" placeholder='修改后的参数 (JSON)' style="width:100%; display:none; margin-top:8px;">
    <button id="submitEditBtn" style="display:none; margin-top:8px;">提交</button>
</div>

<script>
    let ws = null;
    let currentAgent = null;
    let currentRoom = null;
    let agents = [];
    let rooms = {};
    let messageHistory = {};
    let roomMessages = {};
    let currentImageBase64 = null;
    let pendingApproval = null;
    let showToolCalls = true;

    // DOM
    const agentsContainer = document.getElementById('agentsList');
    const roomsContainer = document.getElementById('roomsList');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentChatNameSpan = document.getElementById('currentChatName');
    const currentChatMetaSpan = document.getElementById('currentChatMeta');
    const membersPanel = document.getElementById('membersPanel');
    const membersListDiv = document.getElementById('membersList');
    const inviteSelect = document.getElementById('inviteSelect');
    const inviteBtn = document.getElementById('inviteBtn');
    const connStatusSpan = document.getElementById('connectionStatus');
    const previewDiv = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImgBtn = document.getElementById('removeImageBtn');
    const imageInput = document.getElementById('imageInput');
    const imageBtn = document.getElementById('imageBtn');
    const toggleSwitch = document.getElementById('toggleToolCalls');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const createRoomInput = document.getElementById('createRoomInput');
    const joinRoomInput = document.getElementById('joinRoomInput');
    // approval
    const approvalPanel = document.getElementById('approvalPanel');
    const approvalContent = document.getElementById('approvalContent');
    const approveBtn = document.getElementById('approveBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const editBtn = document.getElementById('editBtn');
    const editArgsInput = document.getElementById('editArgsInput');
    const submitEditBtn = document.getElementById('submitEditBtn');

    marked.setOptions({ breaks: true, gfm: true });

    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 6 + 's';
            p.style.animationDuration = (Math.random() * 3 + 3) + 's';
            container.appendChild(p);
        }
    }

    function isToolMessage(text) {
        return text && (text.startsWith('🔧 调用工具:') || text.startsWith('🛠️ 工具返回:'));
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderAgents() {
        agentsContainer.innerHTML = '';
        agents.forEach(agent => {
            const card = document.createElement('div');
            card.className = 'agent-card';
            if (currentAgent === agent && !currentRoom) card.classList.add('active');
            card.innerHTML = `
                <div class="agent-avatar">🤖</div>
                <div class="agent-info">
                    <div class="agent-name">${escapeHtml(agent)}</div>
                    <div class="agent-status">在线</div>
                </div>
            `;
            card.onclick = () => {
                if (currentRoom) {
                    currentRoom = null;
                    renderRooms();
                    membersPanel.style.display = 'none';
                }
                currentAgent = agent;
                currentChatNameSpan.innerText = agent;
                currentChatMetaSpan.innerText = '对话中';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                renderAgents();
                loadMessages(agent);
                clearUnreadAgent(agent);
            };
            agentsContainer.appendChild(card);
        });
    }

    function renderRooms() {
        roomsContainer.innerHTML = '';
        for (let roomId in rooms) {
            const room = rooms[roomId];
            const card = document.createElement('div');
            card.className = 'room-card';
            if (currentRoom === roomId && !currentAgent) card.classList.add('active');
            card.innerHTML = `
                <div class="room-avatar">🏠</div>
                <div class="room-info">
                    <div class="room-name">${escapeHtml(roomId)}</div>
                    <div class="room-members">${room.members?.length || 0} 人</div>
                </div>
                ${room.unread ? '<div class="unread-dot"></div>' : ''}
            `;
            card.onclick = async () => {
                if (currentAgent) {
                    currentAgent = null;
                    renderAgents();
                }
                currentRoom = roomId;
                currentChatNameSpan.innerText = roomId;
                currentChatMetaSpan.innerText = '群聊';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                renderRooms();
                loadRoomMessages(roomId);
                if (rooms[roomId]) rooms[roomId].unread = false;
                // 请求成员列表
                await fetchRoomMembers(roomId);
                membersPanel.style.display = 'block';
            };
            roomsContainer.appendChild(card);
        }
    }

    async function fetchRoomMembers(roomId) {
        if (!ws) return;
        ws.send(JSON.stringify({ type: 'get_room_members', room_id: roomId }));
    }

    function updateMembersDisplay(roomId, members) {
        if (currentRoom !== roomId) return;
        membersListDiv.innerHTML = '';
        (members || []).forEach(m => {
            const badge = document.createElement('span');
            badge.className = 'member-badge';
            badge.innerText = m;
            membersListDiv.appendChild(badge);
        });
        // 更新邀请下拉框（排除自己 super_user）
        inviteSelect.innerHTML = '<option value="">选择Agent</option>';
        agents.forEach(agent => {
            if (!members.includes(agent)) {
                const option = document.createElement('option');
                option.value = agent;
                option.textContent = agent;
                inviteSelect.appendChild(option);
            }
        });
    }

    function loadMessages(agentId) {
        messagesDiv.innerHTML = '';
        const msgs = messageHistory[agentId] || [];
        msgs.forEach(msg => {
            if (!showToolCalls && isToolMessage(msg.text)) return;
            displayMessage(msg.sender, msg.text, msg.time);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function loadRoomMessages(roomId) {
        messagesDiv.innerHTML = '';
        const msgs = roomMessages[roomId] || [];
        msgs.forEach(msg => {
            if (!showToolCalls && isToolMessage(msg.text)) return;
            displayMessage(msg.sender, msg.text, msg.time);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function displayMessage(sender, text, time) {
        const isSelf = (sender === '我');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSelf ? 'self' : ''}`;
        const rendered = marked.parse(text);
        const timeStr = time || new Date().toLocaleTimeString();
        const senderName = isSelf ? '我' : sender;
        msgDiv.innerHTML = `
            <div class="message-meta">${escapeHtml(senderName)} · ${escapeHtml(timeStr)}</div>
            <div class="bubble">${rendered}</div>
        `;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function markUnreadAgent(agent) { renderAgents(); }
    function clearUnreadAgent(agent) { renderAgents(); }

    function refreshCurrentChat() {
        if (currentAgent) loadMessages(currentAgent);
        else if (currentRoom) loadRoomMessages(currentRoom);
    }

    function sendMessage() {
        let text = messageInput.value.trim();
        if (!text && !currentImageBase64) return;
        let newThread = false;
        if (text.startsWith('/new')) {
            newThread = true;
            text = text.substring(4).trim() || "新对话";
        }
        const time = new Date().toLocaleTimeString();
        if (text) {
            if (currentAgent) {
                if (!messageHistory[currentAgent]) messageHistory[currentAgent] = [];
                messageHistory[currentAgent].push({ sender: '我', text, time });
                displayMessage('我', text, time);
                ws.send(JSON.stringify({
                    type: 'send',
                    to: currentAgent,
                    text: text,
                    image: currentImageBase64 || null,
                    new_thread: newThread
                }));
            } else if (currentRoom) {
                if (!roomMessages[currentRoom]) roomMessages[currentRoom] = [];
                roomMessages[currentRoom].push({ sender: '我', text, time });
                displayMessage('我', text, time);
                ws.send(JSON.stringify({
                    type: 'group_message',
                    room_id: currentRoom,
                    text: text,
                    image: currentImageBase64 || null
                }));
            }
        }
        messageInput.value = '';
        currentImageBase64 = null;
        previewDiv.style.display = 'none';
        imageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    function connect() {
        ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.onopen = () => {
            connStatusSpan.innerText = '● 已连接';
            connStatusSpan.style.color = '#06B6D4';
        };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'agents') {
                agents = (data.agents || []).filter(a => a !== 'super_user');
                renderAgents();
                if (!currentAgent && !currentRoom && agents.length) {
                    currentAgent = agents[0];
                    currentChatNameSpan.innerText = currentAgent;
                    currentChatMetaSpan.innerText = '对话中';
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    renderAgents();
                    loadMessages(currentAgent);
                }
                // 更新邀请下拉列表
                if (currentRoom && rooms[currentRoom]) {
                    updateMembersDisplay(currentRoom, rooms[currentRoom].members || []);
                }
            } else if (data.type === 'message') {
                const from = data.from;
                const text = data.text;
                const time = new Date().toLocaleTimeString();
                if (!messageHistory[from]) messageHistory[from] = [];
                messageHistory[from].push({ sender: from, text, time });
                if (currentAgent === from) {
                    if (showToolCalls || !isToolMessage(text)) displayMessage(from, text, time);
                } else {
                    markUnreadAgent(from);
                    document.title = '📩 新消息';
                    setTimeout(() => { document.title = 'AgentPro · 智能体空间'; }, 3000);
                }
            } else if (data.type === 'group_message') {
                const roomId = data.room_id;
                const from = data.from;
                const text = data.text;
                const time = new Date().toLocaleTimeString();
                if (!roomMessages[roomId]) roomMessages[roomId] = [];
                roomMessages[roomId].push({ sender: from, text, time });
                if (currentRoom === roomId) {
                    if (showToolCalls || !isToolMessage(text)) displayMessage(from, text, time);
                } else {
                    if (rooms[roomId]) rooms[roomId].unread = true;
                    renderRooms();
                    document.title = '📩 新消息';
                }
            } else if (data.type === 'room_members_update') {
                const roomId = data.room_id;
                const members = data.members;
                if (!rooms[roomId]) rooms[roomId] = { members: [], unread: false };
                rooms[roomId].members = members;
                if (currentRoom === roomId) {
                    updateMembersDisplay(roomId, members);
                }
                renderRooms();
            } else if (data.type === 'room_members') {
                const roomId = data.room_id;
                const members = data.members;
                if (!rooms[roomId]) rooms[roomId] = { members: [], unread: false };
                rooms[roomId].members = members;
                if (currentRoom === roomId) {
                    updateMembersDisplay(roomId, members);
                }
                renderRooms();
            } else if (data.type === 'rooms_list') {
                const roomList = data.rooms || [];
                roomList.forEach(rid => {
                    if (!rooms[rid]) rooms[rid] = { members: [], unread: false };
                });
                renderRooms();
            } else if (data.type === 'room_created' || data.type === 'room_joined') {
                const roomId = data.room_id;
                if (!rooms[roomId]) rooms[roomId] = { members: [], unread: false };
                renderRooms();
            } else if (data.type === 'approval_request') {
                pendingApproval = {
                    tool: data.tool,
                    args: data.args,
                    allowed: data.allowed,
                    fromAgent: data.from
                };
                approvalContent.innerHTML = `
                    <strong>🔐 工具调用需要审批</strong><br>
                    工具: ${escapeHtml(data.tool)}<br>
                    参数: ${JSON.stringify(data.args, null, 2)}<br>
                    允许操作: ${data.allowed.join(', ')}
                `;
                approvalPanel.style.display = 'block';
            }
        };
        ws.onclose = () => {
            connStatusSpan.innerText = '● 断开重连';
            connStatusSpan.style.color = '#EC4899';
            setTimeout(connect, 3000);
        };
    }

    // Approval buttons
    approveBtn.onclick = () => {
        if (pendingApproval) {
            ws.send(JSON.stringify({
                type: 'approval_decision',
                to: pendingApproval.fromAgent,
                tool: pendingApproval.tool,
                decision: 'approve'
            }));
            approvalPanel.style.display = 'none';
            pendingApproval = null;
        }
    };
    rejectBtn.onclick = () => {
        if (pendingApproval) {
            ws.send(JSON.stringify({
                type: 'approval_decision',
                to: pendingApproval.fromAgent,
                tool: pendingApproval.tool,
                decision: 'reject'
            }));
            approvalPanel.style.display = 'none';
            pendingApproval = null;
        }
    };
    editBtn.onclick = () => {
        editArgsInput.style.display = 'block';
        submitEditBtn.style.display = 'inline-block';
        editBtn.style.display = 'none';
        editArgsInput.value = JSON.stringify(pendingApproval.args, null, 2);
    };
    submitEditBtn.onclick = () => {
        try {
            const editedArgs = JSON.parse(editArgsInput.value);
            ws.send(JSON.stringify({
                type: 'approval_decision',
                to: pendingApproval.fromAgent,
                tool: pendingApproval.tool,
                decision: 'edit',
                edited_args: editedArgs
            }));
            approvalPanel.style.display = 'none';
            editArgsInput.style.display = 'none';
            submitEditBtn.style.display = 'none';
            editBtn.style.display = 'inline-block';
            pendingApproval = null;
        } catch(e) { alert('JSON格式错误'); }
    };

    // Room actions
    createRoomBtn.onclick = () => {
        const roomId = createRoomInput.value.trim();
        if (!roomId) return;
        ws.send(JSON.stringify({ type: 'create_room', room_id: roomId, agent_id: 'super_user' }));
        createRoomInput.value = '';
    };
    joinRoomBtn.onclick = () => {
        const roomId = joinRoomInput.value.trim();
        if (!roomId) return;
        ws.send(JSON.stringify({ type: 'join_room', room_id: roomId, agent_id: 'super_user' }));
        joinRoomInput.value = '';
    };
    inviteBtn.onclick = () => {
        const targetAgent = inviteSelect.value;
        if (!targetAgent) return;
        ws.send(JSON.stringify({
            type: 'invite_to_room',
            room_id: currentRoom,
            target_agent: targetAgent
        }));
        inviteSelect.value = '';
    };

    // Image upload
    imageBtn.onclick = () => imageInput.click();
    imageInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            currentImageBase64 = ev.target.result.split(',')[1];
            previewImg.src = ev.target.result;
            previewDiv.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    };
    removeImgBtn.onclick = () => {
        currentImageBase64 = null;
        previewDiv.style.display = 'none';
        imageInput.value = '';
    };

    toggleSwitch.onchange = (e) => {
        showToolCalls = e.target.checked;
        refreshCurrentChat();
    };

    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    sendBtn.onclick = sendMessage;

    createParticles();
    connect();
</script>
</body>
</html>
